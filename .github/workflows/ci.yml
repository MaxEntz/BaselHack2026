name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Timeouts well above the usual runs (python and web about 3 min, visual under 1 min), so
  # that a hung test fails its job instead of holding a runner for GitHub's 6 hours.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating major tag)
        with:
          working-directory: code
          enable-cache: true
      - run: uv sync --locked
      # ruff check, ruff format --check, mypy: the same commands as a local run.
      - run: make lint
      # Chromium for the crawler's `browser` tests (#21).
      - run: uv run playwright install --with-deps chromium
      # The built web app, for the browser test of the whole stack (tests/e2e/test_web_stack.py, #153).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: code/web
      # Docker is available on ubuntu-latest, so testcontainers works for integration tests.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:contracts
      - run: npm test
      - run: npm run build
      # Chromium for the browser tests, cached per @playwright/test version (#130).
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e

  # The visual tests (#153) run in Playwright's own image, where their baselines were taken
  # (`npm run test:visual:docker`): fonts render differently on the runner itself.
  visual-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "image=mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' code/web/package-lock.json)-noble" >> "$GITHUB_OUTPUT"

  visual:
    needs: visual-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.visual-image.outputs.image }}
      options: --ipc=host
    defaults:
      run:
        working-directory: code/web
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:visual
      # On a difference, the expected, actual and diff images.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: code/web/test-results/
