<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Petit Zinc · Home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238f2d2a'/%3E%3Ctext x='32' y='45' fill='%23f7f2e8' font-family='Georgia, serif' font-size='38' font-style='italic' font-weight='600' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<style>
/* Demo build: static, self-contained, fake data generated from the restaurant's real booking rules.
   Identity: Le Petit Zinc (code/sites/le-petit-zinc/style.css). */
:root {
  --page: #f7f2e8; --paper-deep: #efe5d2; --card: #fffcf6; --ink: #2a2320; --text2: #3a322e;
  --muted: #675c54; --faint: #998d82; --line: #e6dccb; --line-soft: #efe7d9; --field: #cdbfa6;
  --wine: #8f2d2a; --wine-deep: #6e1f1d; --wine-tint: #f4e4df; --web: #2c6fa6;
  --ok: #2f6b3a; --ok-bg: #e5efe2;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, P052, "URW Palladio L", "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
svg { flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: var(--wine); text-decoration: none; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 368px; height: 100vh; }
.app.no-drawer { grid-template-columns: 248px minmax(0, 1fr); }
.app.no-drawer .drawer { display: none; }

/* Monogram */
.mono { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--wine); color: #f7f2e8;
  display: inline-flex; align-items: center; justify-content: center; font: italic 600 21px/1 var(--serif); }
.mono.sm { width: 26px; height: 26px; border-radius: 7px; font-size: 16px; }
.mono.xs { width: 24px; height: 24px; border-radius: 7px; font-size: 15px; }

/* Sidebar */
.side { background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.kelsch { height: 8px; flex: none; background-color: var(--card);
  background-image: linear-gradient(90deg, rgb(143 45 42 / .5) 50%, transparent 0), linear-gradient(rgb(143 45 42 / .5) 50%, transparent 0);
  background-size: 8px 8px; }
.side-in { padding: 14px 12px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ws { display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 10px; }
.ws .n { flex: 1; min-width: 0; }
.ws b { display: block; font: italic 600 18px/1.1 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: #463d38; }
.nav a:hover { background: var(--paper-deep); }
.nav a svg { color: var(--muted); }
.nav a span { flex: 1; }
.nav a.on { background: var(--wine-tint); color: var(--wine-deep); font-weight: 600; }
.nav a.on svg { color: var(--wine); }
.navsec { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 22px 10px 6px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }

/* Top bar */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; height: 64px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; align-items: center; gap: 12px; padding: 0 28px; position: relative; }
.search { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--faint); background: var(--page); text-align: left; }
.search:hover { border-color: var(--field); }
.search span { flex: 1; }
kbd { font: 500 11px var(--sans); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--muted); background: var(--card); }
.sp { flex: 1; }
.clock { font-size: 12.5px; color: var(--muted); }
.ibtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; }
.ibtn:hover { border-color: var(--field); color: var(--ink); }
.ibtn .dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--wine); border: 2px solid var(--card); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--paper-deep); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: var(--wine-deep); }
.pop { position: absolute; top: 58px; right: 70px; width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgb(42 35 32 / .14); z-index: 30; overflow: hidden; }
.pop h4 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pop .it { display: block; width: 100%; text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-size: 13px; color: var(--ink); }
.pop .it:hover { background: var(--page); }
.pop .it small { display: block; color: var(--faint); font-size: 11.5px; }
.pop .it.new { background: #fff6ef; }

/* Content */
.content { flex: 1; overflow: auto; padding: 30px 36px 48px; display: flex; flex-direction: column; gap: 18px; }
.hello h1, .page-h h1 { margin: 0; font: 600 28px/1.15 var(--serif); letter-spacing: -.01em; }
.hello p, .page-h p { margin: 4px 0 0; color: var(--muted); }
.page-h { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h .r { margin-left: auto; display: flex; gap: 8px; }
.actions, .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 500; font-size: 13.5px; color: var(--text2); white-space: nowrap; }
.btn:hover { border-color: var(--field); }
.btn svg { color: var(--muted); }
.btn.pri { background: var(--wine); border-color: var(--wine); color: #fff; }
.btn.pri:hover { background: var(--wine-deep); }
.btn.pri svg { color: #fff; }
.btn.danger { color: var(--wine); border-color: #e4c7c0; }
.btn.danger:hover { background: var(--wine-tint); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
.seg button { height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg button.ico { width: 32px; padding: 0; justify-content: center; }
.seg button[aria-pressed="true"] { background: var(--paper-deep); color: var(--ink); }
.seg button + button { border-left: 1px solid var(--line); }
.datenav { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 0 4px; height: 34px; }
.datenav b { min-width: 150px; text-align: center; font-weight: 600; font-size: 13.5px; }
.datenav button { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.datenav button:hover { background: var(--paper-deep); color: var(--ink); }
.input { height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 0 12px; min-width: 0; }
.input:focus { outline: 2px solid rgb(143 45 42 / .25); border-color: var(--wine); }
.input[disabled] { color: var(--muted); background: var(--page); }

.cards { display: grid; gap: 16px; }
.r1 { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.r2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgb(42 35 32 / .03); min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.ch { display: flex; align-items: center; gap: 8px; color: var(--text2); font-weight: 600; }
.ch .x { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--faint); font-weight: 400; font-size: 12.5px; }
.big { font: 600 32px/1.1 var(--serif); letter-spacing: -.01em; margin-top: 6px; }
.big small { font: 500 13px var(--sans); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.sub { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 4px; }
.delta { margin-left: auto; display: flex; gap: 14px; color: var(--text2); }
.delta span { display: flex; align-items: center; gap: 4px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.link { color: var(--wine); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.link:hover { color: var(--wine-deep); }

/* Sources */
.src { display: inline-flex; align-items: center; gap: 7px; color: var(--text2); font-size: 12.5px; white-space: nowrap; }
.src i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.src.agent i, i.agent { background: var(--wine); }
.src.website i, i.website { background: var(--web); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper-deep); color: var(--muted); white-space: nowrap; font-style: normal; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--wine-tint); color: var(--wine-deep); }

/* Line chart */
.chart { position: relative; margin: 14px -20px -18px; }
.chart svg { display: block; width: 100%; height: 190px; }
.chart .hit { position: absolute; inset: 0 0 28px 0; cursor: pointer; }
.xl { display: flex; justify-content: space-between; padding: 6px 20px 14px; font-size: 11.5px; color: var(--faint); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 16px rgb(0 0 0 / .15); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 2; }
.tip span { color: #c9bfb4; }
.cdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--wine); border: 2px solid var(--card); transform: translate(-50%, -50%); pointer-events: none; }
.covers-table { margin-top: 12px; max-height: 214px; overflow: auto; font-size: 13px; }

/* Lists */
.list { margin-top: 8px; }
.r { display: grid; grid-template-columns: 50px minmax(0, 1fr) 62px 84px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
button.r { width: 100%; text-align: left; border-radius: 6px; }
button.r:hover { background: var(--page); }
.r .t { font-weight: 600; } .r .p { color: var(--muted); }
.r .g { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.r.blocked { color: var(--faint); }
.r.blocked .g { display: flex; align-items: center; gap: 6px; font-style: italic; }
.r .src { justify-content: flex-end; }

table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
.data td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.data tr.click { cursor: pointer; }
.data tr.click:hover td { background: var(--page); }
.data tr.off td, .data tr.off td .src { color: var(--faint); }
.data .num { text-align: right; }
.data tr.blk td { color: var(--faint); font-style: italic; background: repeating-linear-gradient(135deg, transparent 0 6px, rgb(42 35 32 / .03) 6px 7px); }
.covers-table .data th, .covers-table .data td { padding: 6px 4px; }
.empty { padding: 36px; text-align: center; color: var(--muted); }

/* Small cards */
.stack { display: flex; gap: 2px; height: 10px; margin-top: 16px; }
.stack i { display: block; height: 10px; border-radius: 2px; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--text2); }
.leg span { display: flex; align-items: center; gap: 6px; }
.leg i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.leg b { font-weight: 500; color: var(--muted); }
.meter { height: 10px; border-radius: 3px; background: var(--paper-deep); margin-top: 16px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; color: var(--text2); background: var(--card); }
button.chip:hover { border-color: var(--field); }
.chip.on { background: var(--wine-tint); border-color: #e4c7c0; color: var(--wine-deep); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; margin-top: 12px; }
.week .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; position: relative; cursor: pointer; }
.week .bar { width: 100%; max-width: 26px; background: #dcc9c2; border-radius: 4px 4px 0 0; position: relative; }
.week .col.today .bar { background: var(--wine); }
.week .col:hover .bar { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--field); }
.week .d { font-size: 11px; color: var(--faint); }
.week .col.today .d { color: var(--wine); font-weight: 600; }
.week .v { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink); opacity: 0; }
.week .col:hover .v, .week .col.today .v { opacity: 1; }
.act .row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 170px 86px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; align-items: center; }
.act .row:last-child { border-bottom: 0; }
.act .h { color: var(--faint); font-size: 12.5px; }
.act .w { color: var(--muted); }
.act .src { justify-content: flex-end; }

/* Timeline */
.tl { padding: 16px 20px 20px; }
.tl .axis, .tl .lane-row { display: grid; grid-template-columns: 56px 1fr; align-items: center; }
.tl .ticks { position: relative; height: 18px; font-size: 11px; color: var(--faint); }
.tl .ticks i { position: absolute; font-style: normal; transform: translateX(-50%); }
.tl .lane-row { height: 34px; }
.tl .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.tl .lbl small { font-weight: 400; color: var(--faint); margin-left: 4px; }
.tl .lane { position: relative; height: 34px; border-top: 1px solid var(--line-soft); }
.tl .grid-v { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); }
.tl .bk { position: absolute; top: 5px; height: 24px; border-radius: 5px; font-size: 11.5px; line-height: 24px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; text-align: left; }
.tl .bk.agent { background: var(--wine); } .tl .bk.website { background: var(--web); }
.tl .bk:hover { filter: brightness(1.1); }
.tl .blockcol { position: absolute; top: 18px; bottom: 0; background: repeating-linear-gradient(135deg, rgb(42 35 32 / .13) 0 1px, transparent 1px 6px); border-left: 1px dashed var(--muted); }
.tl .now { position: absolute; top: 18px; bottom: 0; width: 2px; background: var(--wine); opacity: .6; }

/* Floor plan */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; min-height: 116px; display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--field); }
.tile .lab { display: flex; justify-content: space-between; align-items: baseline; font: 600 20px/1 var(--serif); }
.tile .lab small { font: 500 12px var(--sans); color: var(--muted); }
.tile .seats { display: flex; gap: 4px; flex-wrap: wrap; }
.tile .seats i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--field); }
.tile.busy { border-color: #e4c7c0; background: #fff7f2; }
.tile.busy .seats i.f { background: var(--wine); border-color: var(--wine); }
.tile .st { margin-top: auto; font-size: 12.5px; color: var(--muted); }
.tile.busy .st { color: var(--wine-deep); }
.tile.add { align-items: center; justify-content: center; flex-direction: row; border-style: dashed; color: var(--muted); font-weight: 500; }

/* Forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .help { font-size: 12px; color: var(--faint); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); flex: none; }
.stepper button { width: 34px; height: 34px; font-size: 18px; color: var(--muted); }
.stepper button:hover { background: var(--paper-deep); }
.stepper b { min-width: 44px; text-align: center; font-size: 15px; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--field); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--wine); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.setrow { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
.setrow:last-child { border-bottom: 0; }
.setrow .lbl { flex: 1; }
.setrow .lbl b { display: block; font-weight: 600; }
.setrow .lbl small { color: var(--muted); font-size: 12.5px; }
.err { color: var(--wine); font-size: 12.5px; font-weight: 500; }
.note { font-size: 12.5px; color: var(--muted); background: var(--page); border: 1px solid var(--line-soft); border-radius: 9px; padding: 10px 12px; }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: rgb(42 35 32 / .28); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.overlay.sheet-o { align-items: stretch; justify-content: flex-end; padding: 0; }
.modal { width: 460px; max-width: calc(100vw - 32px); background: var(--card); border-radius: 14px; box-shadow: 0 24px 60px rgb(42 35 32 / .25); overflow: hidden; }
.modal .mh, .sheet .mh { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 15px; }
.modal .mh .x, .sheet .mh .x { margin-left: auto; color: var(--faint); }
.modal .mb, .sheet .mb { padding: 18px 20px; }
.modal .mf, .sheet .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--page); }
.sheet { width: 440px; max-width: 100vw; height: 100%; background: var(--card); box-shadow: -12px 0 40px rgb(42 35 32 / .15); display: flex; flex-direction: column; }
.sheet .mb { flex: 1; overflow: auto; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; }
.sheet h3 { font: 600 22px/1.2 var(--serif); margin: 0 0 4px; }
.sheet h4 { margin: 22px 0 8px; font-size: 12.5px; color: var(--muted); }
.palette { width: 560px; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 16px 20px; font-size: 15px; background: var(--card); outline: none; }
.palette .res { max-height: 380px; overflow: auto; padding: 6px; }
.palette .res button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; text-align: left; font-size: 13.5px; }
.palette .res button.sel, .palette .res button:hover { background: var(--paper-deep); }
.palette .res small { margin-left: auto; color: var(--faint); font-size: 12px; }
.palette .grp { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 10px 12px 4px; }
.toasts { position: fixed; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--ink); color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 13px; box-shadow: 0 10px 28px rgb(0 0 0 / .2); max-width: 380px; animation: tin .2s ease-out; }
.toast b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #e8b7ad; margin-bottom: 2px; }

<!-- ===================== Data & booking rules (no DOM) ===================== -->
<script id="logic">
"use strict";
const TODAY = "2026-10-31";
const NOW0 = 18 * 60 + 5; // the demo starts on Saturday 31 October 2026 at 18:05

const pad = n => String(n).padStart(2, "0");
const hm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const dUTC = s => { const [y, mo, d] = s.split("-").map(Number); return Date.UTC(y, mo - 1, d); };
const addDays = (s, n) => new Date(dUTC(s) + n * 864e5).toISOString().slice(0, 10);
const diffDays = (a, b) => Math.round((dUTC(a) - dUTC(b)) / 864e5);
const dow = s => new Date(dUTC(s)).getUTCDay();
const WD = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MO = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const dayNum = s => Number(s.slice(8, 10));
const monIdx = s => Number(s.slice(5, 7)) - 1;
const fmtShort = s => `${WD[dow(s)].slice(0, 3)} ${dayNum(s)} ${MO[monIdx(s)].slice(0, 3)}`;
const fmtLong = s => `${WD[dow(s)]} ${dayNum(s)} ${MO[monIdx(s)]}`;
const fmtDM = s => `${dayNum(s)} ${MO[monIdx(s)].slice(0, 3)}`;
const cmpAt = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.min - b.min);
const tnum = l => Number(l.replace(/\D/g, ""));

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pick(r, weighted) { let x = r() * weighted.reduce((a, w) => a + w[1], 0); for (const [v, w] of weighted) { if ((x -= w) < 0) return v; } return weighted[weighted.length - 1][0]; }

/* ---- Booking rules (AGENTS.md §6) ---- */
function startsOf(svc) { const out = []; for (let m = svc.start; m <= svc.end - 60; m += 30) out.push(m); return out; }
function bookableStarts(st) { return st.services.flatMap(startsOf).sort((a, b) => a - b); }
function serviceAt(st, min) { return st.services.find(s => min >= s.start && min <= s.end - 60) || null; }
function isBlocked(st, date, min) { return st.blocked.some(b => b.date === date && b.start === min); }
function isPast(date, min, now) { return date < TODAY || (date === TODAY && min <= now); }
function tableFree(st, label, date, start, ignoreId) {
  return !st.reservations.some(r => r.status === "confirmed" && r.table === label && r.date === date && r.id !== ignoreId &&
    r.start < start + st.slotLen && start < r.start + st.slotLen);
}
function findTable(st, date, start, party, ignoreId) {
  return [...st.tables].filter(t => t.seats >= party).sort((a, b) => a.seats - b.seats || tnum(a.label) - tnum(b.label))
    .find(t => tableFree(st, t.label, date, start, ignoreId)) || null;
}
/* Every write goes through these checks. Returns { table } or { error, message }. */
function checkSlot(st, date, start, party, now, ignoreId) {
  if (party < 1) return { error: "invalid", message: "A booking needs at least one guest." };
  if (party > st.maxParty) return { error: "party_too_large", message: `Groups above ${st.maxParty} can’t book online.` };
  if (!bookableStarts(st).includes(start)) return { error: "closed", message: `${hm(start)} isn’t a bookable start time.` };
  if (isPast(date, start, now)) return { error: "past", message: `${hm(start)} has already passed.` };
  if (isBlocked(st, date, start)) return { error: "blocked", message: `${hm(start)} is blocked on ${fmtShort(date)}.` };
  const t = findTable(st, date, start, party, ignoreId);
  if (!t) return { error: "full", message: `No table for ${party} is free at ${hm(start)} on ${fmtShort(date)}.` };
  return { table: t.label };
}
function availability(st, date, party, around, now) {
  return bookableStarts(st).map(m => ({ m, c: checkSlot(st, date, m, party, now) })).filter(x => x.c.table)
    .sort((a, b) => Math.abs(a.m - around) - Math.abs(b.m - around) || a.m - b.m).slice(0, 3)
    .sort((a, b) => a.m - b.m).map(x => ({ start: x.m, table: x.c.table }));
}

/* ---- Stats ---- */
const confirmedOn = (st, date) => st.reservations.filter(r => r.date === date && r.status === "confirmed");
function covers(st, date, svc) { return confirmedOn(st, date).filter(r => !svc || serviceAt(st, r.start) === svc).reduce((a, r) => a + r.party, 0); }
function seatsTotal(st) { return st.tables.reduce((a, t) => a + t.seats, 0); }

/* ---- Fake data ---- */
const FIRST = ["Léa", "Thomas", "Claire", "Lukas", "Sophie", "Andreas", "Julie", "Marc", "Anne", "Nina", "Paul", "Emma", "Hugo", "Chloé", "Louis", "Manon", "Jonas", "Laura", "Nicolas", "Sarah", "Elias", "Mathieu", "Elise", "Simon", "Inès", "Yves", "Alice", "Pierre", "Marie", "Jan", "Lena", "Felix", "Mia", "David", "Eva", "Romain", "Pauline", "Tobias", "Hannah", "Lucas"];
const LAST = ["Martin", "Schmitt", "Dubois", "Keller", "Muller", "Meier", "Weber", "Roth", "Fischer", "Brunner", "Wagner", "Huber", "Klein", "Bernard", "Lefèvre", "Graf", "Koch", "Moser", "Frey", "Bauer", "Zimmermann", "Lambert", "Girard", "Hoffmann", "Baumann", "Steiner", "Vogel", "Marchal", "Kieffer", "Gauthier", "Ritter", "Wolf", "Schneider", "Haas", "Burger", "Lehmann", "Jung", "Fuchs"];
const LIVE_GUESTS = ["Nina Brunner", "Hugo Lambert", "Elise Kieffer"];

function initialState() {
  const r = rng(20261031);
  const st = {
    restaurant: { name: "Le Petit Zinc", cuisine: "Bistrot alsacien", city: "Mulhouse", address: "14 rue des Ferblantiers, 68100 Mulhouse",
      website: "http://localhost:8080/", bookingPage: "http://localhost:8080/reservation.html", price: "€€",
      tags: ["vegetarian", "gluten-free", "terrace", "kid-friendly"] },
    services: [{ key: "lunch", name: "Lunch", start: 720, end: 840 }, { key: "dinner", name: "Dinner", start: 1140, end: 1320 }],
    maxParty: 6, slotLen: 120,
    tables: [2, 2, 2, 2, 4, 4, 4, 4, 4, 4, 6, 6].map((s, i) => ({ label: "T" + (i + 1), seats: s })),
    reservations: [], blocked: [], notices: [], events: [],
    settings: { live: true },
  };
  st.blocked.push({ date: "2026-11-05", start: 1200, at: { date: "2026-10-28", min: 10 * 60 + 12 }, reason: "Private event" });

  // Guest pool: unique names, regulars first; the live-demo guests are new guests.
  const TONIGHT = [
    ["Léa Martin", 1140, 2, "website", ["2026-10-24", 11 * 60 + 12]], ["Thomas Schmitt", 1140, 4, "agent", ["2026-10-29", 21 * 60 + 40]],
    ["Claire Dubois", 1140, 2, "website", ["2026-10-27", 9 * 60 + 5]], ["Lukas Keller", 1170, 4, "agent", ["2026-10-30", 13 * 60 + 22]],
    ["Sophie Muller", 1170, 2, "website", ["2026-10-30", 19 * 60 + 48]], ["Andreas Meier", 1200, 6, "agent", [TODAY, 17 * 60 + 41]],
    ["Julie Weber", 1200, 4, "agent", [TODAY, 12 * 60 + 15]], ["Marc Roth", 1230, 3, "agent", [TODAY, 18 * 60 + 4]],
    ["Anne Fischer", 1230, 2, "website", [TODAY, 10 * 60 + 30]],
  ];
  const pool = [], seen = new Set(LIVE_GUESTS);
  for (const [g] of TONIGHT) seen.add(g);
  while (pool.length < 300) { const n = FIRST[Math.floor(r() * FIRST.length)] + " " + LAST[Math.floor(r() * LAST.length)]; if (!seen.has(n)) { seen.add(n); pool.push(n); } }
  TONIGHT.forEach(([g], i) => pool.splice(4 + i * 11, 0, g)); // tonight's guests have some history
  const busy = new Map([[TODAY, new Set(TONIGHT.map(x => x[0]))]]); // one booking per guest per day
  const guest = d => { const used = busy.get(d) || new Set(); busy.set(d, used);
    for (;;) { const g = pool[Math.floor(pool.length * Math.pow(r(), 1.2))]; if (!used.has(g)) { used.add(g); return g; } } };

  const DEMAND = { lunch: [10, 5, 6, 6, 6, 8, 9], dinner: [9, 6, 7, 8, 10, 12, 12] }; // Sun..Sat
  const START_W = { lunch: [[720, 45], [750, 40], [780, 15]], dinner: [[1140, 20], [1170, 25], [1200, 30], [1230, 15], [1260, 10]] };
  const PARTY_W = [[2, 46], [3, 10], [4, 28], [5, 5], [6, 9]];
  const first = "2026-09-01", last = "2026-11-07", span = diffDays(last, first);

  for (let d = first; d <= last; d = addDays(d, 1)) {
    const progress = diffDays(d, first) / span, ahead = diffDays(d, TODAY);
    const lead = ahead <= 0 ? 1 : [1, .8, .58, .46, .4, .36, .33, .3][Math.min(ahead, 7)];
    for (const svc of st.services) {
      if (d === TODAY && svc.key === "dinner") continue; // tonight is scripted below
      const n = Math.round(DEMAND[svc.key][dow(d)] * (0.82 + 0.3 * progress) * lead * (0.85 + 0.3 * r()));
      for (let k = 0; k < n; k++) {
        const start = pick(r, START_W[svc.key]), party = pick(r, PARTY_W);
        if (isBlocked(st, d, start)) continue;
        const t = findTable(st, d, start, party); if (!t) continue;
        // Booked before the slot and before the demo's "now".
        let leadDays = Math.max(ahead, 0) + pick(r, [[0, 18], [1, 22], [2, 16], [3, 12], [5, 10], [7, 8], [10, 6], [14, 4]]), at;
        for (;;) {
          const cd = addDays(d, -leadDays); let lo = 8 * 60, hi = 22 * 60 + 30;
          if (cd === d) hi = Math.min(hi, start - 45);
          if (cd === TODAY) hi = Math.min(hi, NOW0 - 6);
          if (hi > lo) { at = { date: cd, min: lo + Math.floor(r() * (hi - lo)) }; break; }
          leadDays++;
        }
        const res = { id: "", date: d, start, party, table: t.label, guest: guest(d), source: r() < 0.28 + 0.36 * progress ? "agent" : "website", status: "confirmed", at };
        if (r() < 0.045) { // some guests cancel; a few cancellations come from the restaurant
          const startAt = { date: d, min: start }, nowAt0 = { date: TODAY, min: NOW0 - 6 };
          const lim = cmpAt(startAt, nowAt0) < 0 ? startAt : nowAt0;
          const cd = addDays(at.date, Math.floor(r() * (Math.max(diffDays(lim.date, at.date), 0) + 1)));
          const lo = cd === at.date ? at.min + 5 : 8 * 60, hi = cd === lim.date ? lim.min - 30 : 22 * 60 + 30;
          if (hi > lo) { res.status = "cancelled"; res.cancelledBy = r() < 0.85 ? "guest" : "restaurant"; res.cancelledAt = { date: cd, min: lo + Math.floor(r() * (hi - lo)) }; }
        }
        st.reservations.push(res);
      }
    }
  }
  for (const [g, start, party, source, [cd, cm]] of TONIGHT) {
    st.reservations.push({ id: "", date: TODAY, start, party, table: findTable(st, TODAY, start, party).label, guest: g, source, status: "confirmed", at: { date: cd, min: cm } });
  }
  // References follow booking order.
  st.reservations.sort((a, b) => cmpAt(a.at, b.at) || (a.date < b.date ? -1 : 1));
  st.reservations.forEach((x, i) => { x.id = "R-" + String(i + 1).padStart(4, "0"); });
  st.nextId = st.reservations.length + 1;
  for (const x of st.reservations) {
    st.events.push({ type: "created", at: x.at, rid: x.id });
    if (x.status === "cancelled") {
      st.events.push({ type: "cancelled", at: x.cancelledAt, rid: x.id, by: x.cancelledBy });
      if (x.cancelledBy === "restaurant") st.notices.push({ guest: x.guest, rid: x.id, at: x.cancelledAt });
    }
  }
  st.blocked.push({ date: TODAY, start: 1260, at: { date: TODAY, min: NOW0 }, reason: "" });
  st.events.push({ type: "blocked", at: { date: "2026-10-28", min: 10 * 60 + 12 }, date: "2026-11-05", start: 1200 });
  st.events.push({ type: "blocked", at: { date: TODAY, min: NOW0 }, date: TODAY, start: 1260 });
  st.events.sort((a, b) => cmpAt(a.at, b.at));
  return st;
}

/* Invariants the demo data must satisfy. Returns the problems found (empty = perfect). */
function selfTest(st, now) {
  const errs = [], ids = new Set(), starts = bookableStarts(st), nowA = { date: TODAY, min: now };
  for (const x of st.reservations) {
    if (ids.has(x.id)) errs.push(`duplicate id ${x.id}`); ids.add(x.id);
    if (!starts.includes(x.start)) errs.push(`${x.id} starts at ${hm(x.start)}, not a bookable time`);
    const t = st.tables.find(t => t.label === x.table);
    if (!t) errs.push(`${x.id} on unknown table ${x.table}`); else if (x.party > t.seats) errs.push(`${x.id}: ${x.party} guests on ${x.table} (${t.seats} seats)`);
    if (x.party > st.maxParty) errs.push(`${x.id}: party ${x.party} above the maximum`);
    if (cmpAt(x.at, nowA) > 0) errs.push(`${x.id} booked in the future`);
    if (cmpAt(x.at, { date: x.date, min: x.start }) >= 0) errs.push(`${x.id} booked after its start`);
    if (x.status === "cancelled" && (cmpAt(x.cancelledAt, x.at) <= 0 || cmpAt(x.cancelledAt, nowA) > 0 || cmpAt(x.cancelledAt, { date: x.date, min: x.start }) >= 0)) errs.push(`${x.id} cancelled at an impossible time`);
    if (!["agent", "website"].includes(x.source)) errs.push(`${x.id} unknown source ${x.source}`);
    const blk = st.blocked.find(b => b.date === x.date && b.start === x.start);
    if (blk && x.status === "confirmed" && cmpAt(x.at, blk.at) > 0) errs.push(`${x.id} booked on a blocked time`);
  }
  const conf = st.reservations.filter(x => x.status === "confirmed"), perDay = new Set();
  for (const x of conf) { const k = x.guest + x.date; if (perDay.has(k)) errs.push(`${x.guest} has two bookings on ${x.date}`); perDay.add(k); }
  for (let i = 0; i < conf.length; i++) for (let j = i + 1; j < conf.length; j++) {
    const a = conf[i], b = conf[j];
    if (a.table === b.table && a.date === b.date && a.start < b.start + st.slotLen && b.start < a.start + st.slotLen) errs.push(`overlap ${a.id} / ${b.id} on ${a.table}`);
  }
  [...st.reservations].sort((a, b) => cmpAt(a.at, b.at)).forEach((x, i, arr) => { if (i && x.id < arr[i - 1].id) errs.push(`reference order ${x.id}`); });
  return errs;
}
if (typeof module !== "undefined") module.exports = { initialState, selfTest, covers, confirmedOn, availability, checkSlot, bookableStarts, seatsTotal, serviceAt, TODAY, NOW0, hm, addDays, fmtShort };
</script>

<script>
"use strict";
let S = initialState();
let T0 = Date.now();
const nowMin = () => Math.min(NOW0 + Math.floor((Date.now() - T0) / 60000), 23 * 60 + 59);
const nowAt = () => ({ date: TODAY, min: nowMin() });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, el = document) => el.querySelector(s);
const SRC = { agent: "Agent", website: "Website" };

function parseDay(t) {
  if (/\b(tonight|today|this evening|this afternoon)\b/.test(t)) return TODAY;
  if (/\btomorrow\b/.test(t)) return addDays(TODAY, 1);
  for (let i = 0; i < 7; i++) { const d = addDays(TODAY, i), w = WD[dow(d)].toLowerCase(); if (new RegExp(`\\b(${w}|${w.slice(0, 3)})\\b`).test(t)) return d; }
  let m = t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(oct|nov)/);
  if (m) return `2026-${m[2] === "oct" ? "10" : "11"}-${pad(+m[1])}`;
  m = t.match(/\b(oct|nov)\w*\s+(\d{1,2})\b/);
  if (m) return `2026-${m[1] === "oct" ? "10" : "11"}-${pad(+m[2])}`;
  return null;
}
function parseTime(t) {
  let m = t.match(/\b(\d{1,2})[:h](\d{2})\b/) || t.match(/\b(\d{1,2})h\b/);
  if (m) return +m[1] * 60 + (+m[2] || 0);
  m = t.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
  if (m) return ((+m[1] % 12) + (m[3] === "pm" ? 12 : 0)) * 60 + (+m[2] || 0);
  m = t.match(/\bat\s+(\d{1,2})\b(?!\s*(people|guests|persons))/);
  if (m) { const h = +m[1]; return (h < 11 ? h + 12 : h) * 60; }
  return null;
}
function parseParty(t) { const m = t.match(/\b(?:for|party of)\s+(\d{1,2})\b(?![:h]\d)/) || t.match(/\b(\d{1,2})\s*(?:people|guests|persons|pax)\b/); return m ? +m[1] : null; }

function cancelBooking(id) {
  const r = byId(id);
  if (!r) return { ok: false, message: `There is no booking <b>${id}</b>.` };
  if (r.status === "cancelled") return { ok: false, message: `<b>${id}</b> is already cancelled.` };
  if (isPast(r.date, r.start, nowMin())) return { ok: false, message: `<b>${id}</b> has already started.` };
  r.status = "cancelled"; r.cancelledBy = "restaurant"; r.cancelledAt = nowAt();
  S.notices.push({ guest: r.guest, rid: r.id, at: nowAt() }); logEvent({ type: "cancelled", rid: r.id, by: "restaurant" });
  return { ok: true, r };
}
function moveBooking(id, start) {
  const r = byId(id), c = checkSlot(S, r.date, start, r.party, nowMin(), r.id);
  if (!c.table) return { ok: false, message: c.message };
  const from = r.start; r.start = start; r.table = c.table; logEvent({ type: "moved", rid: r.id, from });
  return { ok: true };

function blockSlot(date, start) {
  if (!bookableStarts(S).includes(start)) return { ok: false, message: `${hm(start)} isn’t a start time. Bookable start times are ${startsList()}.` };
  if (isPast(date, start, nowMin())) return { ok: false, message: `${hm(start)} ${dayLabel(date, start)} has already passed.` };
  if (isBlocked(S, date, start)) return { ok: false, message: `${hm(start)} is already blocked ${dayLabel(date, start)}.` };
  S.blocked.push({ date, start, at: nowAt(), reason: "" }); logEvent({ type: "blocked", date, start });

}
function unblockSlot(date, start) {
  const i = S.blocked.findIndex(b => b.date === date && b.start === start);
  if (i < 0) return { ok: false, message: `${hm(start)} isn’t blocked ${dayLabel(date, start)}.` };
  S.blocked.splice(i, 1); logEvent({ type: "unblocked", date, start });

}
function setMaxParty(n) {
  if (!Number.isInteger(n) || n < 1 || n > 20) return { ok: false, message: "The maximum party size must be between 1 and 20." };

function drawCovers() {
  const box = document.getElementById("covers-chart"); if (!box) return;
  const days = [...Array(30)].map((_, i) => addDays(TODAY, i - 29));
  const series = days.map(d => ({ d, c: covers(S, d), a: confirmedOn(S, d).filter(r => r.source === "agent").reduce((x, r) => x + r.party, 0) }));
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), dot = box.querySelector(".cdot"), hit = box.querySelector(".hit");
  const W = 600, H = 190, padT = 14, padB = 4, max = Math.ceil(Math.max(...series.map(s => s.c)) / 25) * 25 + 10;
  const x = i => (i / (series.length - 1)) * W, y = v => padT + (1 - v / max) * (H - padT - padB);
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s.c).toFixed(1)}`).join(" L");
  svg.innerHTML = `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f2d2a" stop-opacity=".16"/><stop offset="1" stop-color="#8f2d2a" stop-opacity="0"/></linearGradient></defs>
    ${[.25, .5, .75].map(f => `<line x1="0" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#efe7d9" vector-effect="non-scaling-stroke"/>`).join("")}
    <path d="M${pts} L${W},${H} L0,${H} Z" fill="url(#fill)"/><path d="M${pts}" fill="none" stroke="#8f2d2a" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line class="cross" y1="0" y2="${H}" stroke="#2a2320" stroke-opacity=".3" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" visibility="hidden"/>`;
  const cross = svg.querySelector(".cross");

    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(series.length - 1, Math.round(((e.clientX - r.left) / r.width) * (series.length - 1)))), s = series[i];
    const px = (x(i) / W) * r.width, py = (y(s.c) / H) * r.height;

    hit.dataset.d = s.d;
  };
  hit.onmouseleave = () => { tip.hidden = true; dot.hidden = true; cross.setAttribute("visibility", "hidden"); };

}

/* ---------------- Overlays ---------------- */
const root = () => document.getElementById("overlay-root");
function closeOverlay() { root().innerHTML = ""; }
function modal(title, body, foot, cls = "") { root().innerHTML = `<div class="overlay" data-act="overlay"><div class="modal ${cls}" role="dialog" aria-label="${esc(title || "Search")}">${title ? `<div class="mh">${title}<button class="x" data-act="close" aria-label="Close">${ic("x", 16)}</button></div>` : ""}${body}${foot ? `<div class="mf">${foot}</div>` : ""}</div></div>`; }
function sheet(title, body, foot) { root().innerHTML = `<div class="overlay sheet-o" data-act="overlay"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="mh">${title}<button class="x" data-act="close" aria-label="Close">${ic("x", 16)}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div></div>`; }

function openRes(id, msg = "") {
  const r = byId(id), now = nowMin(), live = r.status === "confirmed" && !isPast(r.date, r.start, now);
  const alts = live ? bookableStarts(S).filter(m => m !== r.start).map(m => ({ m, c: checkSlot(S, r.date, m, r.party, now, r.id) })).filter(x => x.c.table) : [];
  const t = S.tables.find(x => x.label === r.table);
  sheet(r.id, `<h3>${esc(r.guest)}</h3><p class="muted" style="margin:0 0 18px">${fmtLong(r.date)} · ${hm(r.start)}–${hm(r.start + S.slotLen)}</p>
    <dl class="kv"><dt>Guests</dt><dd>${r.party}</dd><dt>Table</dt><dd>${r.table}${t ? ` · ${t.seats} seats` : ""}</dd>
    <dt>Service</dt><dd>${serviceName(r.start)}</dd><dt>Booked via</dt><dd>${src(r.source)}</dd>
    <dt>Booked</dt><dd>${fmtShort(r.at.date)} at ${hm(r.at.min)}</dd>
    <dt>Status</dt><dd>${statusTag(r)}${r.status === "cancelled" ? ` <span class="faint">by ${r.cancelledBy === "guest" ? "the guest" : "you"}, ${fmtShort(r.cancelledAt.date)} ${hm(r.cancelledAt.min)}</span>` : ""}</dd></dl>
    ${r.status === "cancelled" && r.cancelledBy === "restaurant" ? `<div class="note" style="margin-top:16px">${esc(r.guest)} was told the restaurant cancelled.</div>` : ""}
    ${live ? `<h4>Move to another time</h4><div class="slots">${alts.map(x => `<button class="chip" data-act="move" data-id="${r.id}" data-m="${x.m}">${hm(x.m)} · ${x.c.table}</button>`).join("") || `<span class="faint">No other time is free for ${r.party} that day.</span>`}</div>` : ""}
    ${msg ? `<p class="err" style="margin-top:12px">${msg}</p>` : ""}
    <h4>Other bookings by ${esc(r.guest)}</h4>${guestHistory(r.guest, r.id)}`,
    live ? `<button class="btn danger" data-act="cancel-ask" data-id="${r.id}">Cancel booking</button><button class="btn" data-act="close">Close</button>` : `<button class="btn" data-act="close">Close</button>`);
}
function guestHistory(name, except) {
  const list = S.reservations.filter(r => r.guest === name && r.id !== except).sort((a, b) => cmpAt({ date: b.date, min: b.start }, { date: a.date, min: a.start }));
  return list.length ? `<div class="list">${list.map(r => `<button class="r" style="grid-template-columns:96px 46px 1fr 78px" data-act="res" data-id="${r.id}"><span>${fmtShort(r.date)}</span><span class="t">${hm(r.start)}</span><span class="p">${r.party} guests · ${r.table}${r.status === "cancelled" ? " · cancelled" : ""}</span>${src(r.source)}</button>`).join("")}</div>` : `<p class="faint" style="margin:0">None.</p>`;
}
function openGuest(name) {
  const g = guestIndex().find(x => x.name === name);
  sheet("Guest", `<h3>${esc(name)}</h3><p class="muted" style="margin:0 0 18px">${g.visits} visit${g.visits === 1 ? "" : "s"} · ${g.covers} guests brought${g.last ? ` · last visit ${fmtShort(g.last)}` : ""}</p>
    ${g.upcoming ? `<div class="note">Next booking: <b>${fmtLong(g.upcoming.date)} at ${hm(g.upcoming.start)}</b>, ${g.upcoming.party} guests, ${g.upcoming.table}.</div>` : ""}

function blockDialog(date = TODAY, start = null, err = "") {
  const dates = [...Array(14)].map((_, i) => addDays(TODAY, i));
  const opts = bookableStarts(S).filter(m => !isPast(date, m, nowMin()));
  if (start == null || !opts.includes(start)) start = opts.find(m => !isBlocked(S, date, m)) ?? null;
  const n = start == null ? 0 : confirmedOn(S, date).filter(r => r.start === start).length;
  modal("Block a time", `<div class="mb"><div class="form">
    <div class="row2"><label class="field"><span>Day</span><select class="input" data-blk="date">${dates.map(d => `<option value="${d}" ${d === date ? "selected" : ""}>${d === TODAY ? "Today" : fmtShort(d)}</option>`).join("")}</select></label>
    <label class="field"><span>Start time</span><select class="input" data-blk="start">${opts.map(m => `<option value="${m}" ${m === start ? "selected" : ""} ${isBlocked(S, date, m) ? "disabled" : ""}>${hm(m)}${isBlocked(S, date, m) ? " · blocked" : ""}</option>`).join("")}</select></label></div>
    <div class="note">${start == null ? "Every remaining time that day is already blocked or past." : `Guests won’t be offered ${hm(start)} anymore. ${n ? `The ${n} booking${n > 1 ? "s" : ""} already at that time stay${n > 1 ? "" : "s"}.` : "Nobody is booked at that time."}`}</div>
    ${err ? `<div class="err">${err}</div>` : ""}</div></div>`,
    `<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="block-save" ${start == null ? "disabled" : ""}>Block ${start == null ? "" : hm(start)}</button>`);

function upcomingMax(label) { return Math.max(0, ...S.reservations.filter(r => r.table === label && r.status === "confirmed" && !isPast(r.date, r.start, nowMin())).map(r => r.party)); }
function openTable(label, err = "") {
  const t = S.tables.find(x => x.label === label), used = S.reservations.some(r => r.table === label), need = upcomingMax(label);
  modal(`Table ${label}`, `<div class="mb"><div class="form">
    <div class="setrow" style="padding-top:0"><div class="lbl"><b>Seats</b><small>${need ? `Upcoming bookings on ${label} need at least ${need}.` : "No upcoming booking on this table."}</small></div>
    <span class="stepper"><button data-act="seats" data-l="${label}" data-n="-1" aria-label="Fewer seats">−</button><b>${t.seats}</b><button data-act="seats" data-l="${label}" data-n="1" aria-label="More seats">+</button></span></div>
    ${err ? `<div class="err">${err}</div>` : ""}
    ${used ? `<div class="note">${label} can’t be removed because bookings refer to it. You can still change its seats.</div>` : ""}</div></div>`,
    `${used ? "" : `<button class="btn danger" data-act="table-remove" data-l="${label}" style="margin-right:auto">Remove table</button>`}<button class="btn pri" data-act="close">Done</button>`);

/* Search (⌘K) */
let palSel = 0, palCur = [];
function openPalette() { modal("", `<input placeholder="Search a guest, a reference (R-…), a page…" data-pal aria-label="Search"><div class="res" id="pal-res"></div>`, "", "palette"); $("[data-pal]").focus(); palSel = 0; palRender(""); }
function palItems(q) {
  q = q.trim().toLowerCase();
  const out = [...ROUTES, ["settings", "Settings"]].filter(r => !q || r[1].toLowerCase().includes(q)).map(r => ({ grp: "Pages", label: r[1], sub: "", act: () => go(r[0]) }));
  if (q) {
    const id = q.match(/^r-?(\d{1,4})$/);
    S.reservations.filter(r => id ? r.id === "R-" + id[1].padStart(4, "0") : r.guest.toLowerCase().includes(q))
      .sort((a, b) => cmpAt({ date: b.date, min: b.start }, { date: a.date, min: a.start })).slice(0, 6)
      .forEach(r => out.push({ grp: "Bookings", label: `${r.id} · ${r.guest}`, sub: `${fmtShort(r.date)} ${hm(r.start)}${r.status === "cancelled" ? " · cancelled" : ""}`, act: () => openRes(r.id) }));
    [...new Set(S.reservations.map(r => r.guest))].filter(g => g.toLowerCase().includes(q)).slice(0, 5).forEach(g => out.push({ grp: "Guests", label: g, sub: "", act: () => openGuest(g) }));
  }
  return out;
}
function palRender(q) {
  palCur = palItems(q); palSel = Math.min(palSel, Math.max(palCur.length - 1, 0)); let g = "";
  $("#pal-res").innerHTML = palCur.map((x, i) => (x.grp !== g ? `<div class="grp">${(g = x.grp)}</div>` : "") + `<button class="${i === palSel ? "sel" : ""}" data-act="pal" data-i="${i}">${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join("") || `<div class="empty">No result.</div>`;
}
function palGo(i) { const it = palCur[i]; if (!it) return; closeOverlay(); it.act(); }

function toast(kind, text) { const el = document.createElement("div"); el.className = "toast"; el.innerHTML = `<b>${kind}</b>${text}`; $("#toasts").appendChild(el); setTimeout(() => el.remove(), 6000); }

/* Notifications */
function notifs() { return S.events.filter(e => (e.type === "created" || (e.type === "cancelled" && e.by === "guest")) && cmpAt(e.at, nowAt()) <= 0).sort((a, b) => cmpAt(b.at, a.at)).slice(0, 8); }
function renderBell() {
  const pop = $("#bell-pop");
  $("#bell-dot").hidden = pop.hidden ? !notifs().some(e => cmpAt(e.at, UI.bellSeen) > 0) : true;
  if (pop.hidden) return;
  pop.innerHTML = `<h4>Notifications</h4>${notifs().map(e => { const r = byId(e.rid); return `<button class="it${cmpAt(e.at, UI.bellSeenPrev || UI.bellSeen) > 0 ? " new" : ""}" data-act="res" data-id="${r.id}">${e.type === "created" ? "New booking" : "Cancelled by the guest"} · ${SRC[r.source]}<br>${esc(r.guest)} · ${r.party} guests · ${r.date === TODAY ? "today" : fmtShort(r.date)} ${hm(r.start)}<small>${whenAt(e.at)}</small></button>`; }).join("")}`;
}

/* ---------------- Router ---------------- */
function go(r) { location.hash = "#/" + r; }
function goDay(d) { UI.resDate = d; UI.resSvc = "all"; UI.resQ = ""; closeOverlay(); if (UI.route === "reservations") refresh(); else go("reservations"); }
function refresh() {
  const R = S.restaurant;
  $("#ws-name").textContent = R.name; $("#ws-sub").textContent = `${R.cuisine.split(" ")[0]} · ${R.city}`;
  document.title = `${R.name} · ${(ROUTES.find(x => x[0] === UI.route) || ["", "Settings"])[1]}`;
  let sec = "";
  $("#nav").innerHTML = ROUTES.map(([k, l, i, s]) => (s && s !== sec ? `<div class="navsec">${(sec = s)}</div>` : "") + `<a href="#/${k}" class="${UI.route === k ? "on" : ""}">${ic(i)}<span>${l}</span></a>`).join("");
  $("#nav-foot").innerHTML = `<a href="#/settings" class="${UI.route === "settings" ? "on" : ""}">${ic("gear")}<span>Settings</span></a>`;
  const v = { home: viewHome, assistant: viewAssistant, reservations: viewReservations, guests: viewGuests, hours: viewHours, floor: viewFloor, rules: viewRules, settings: viewSettings }[UI.route] || viewHome;
  const view = $("#view"), ae = document.activeElement, focus = ae && ae.dataset && ae.dataset.input, caret = focus ? ae.selectionStart : 0, scroll = view.scrollTop;
  view.innerHTML = v(); view.classList.toggle("chat", UI.route === "assistant"); view.scrollTop = scroll;
  if (focus) { const el = view.querySelector(`[data-input="${focus}"]`); if (el) { el.focus(); el.setSelectionRange(caret, caret); } }
  $("#app").classList.toggle("no-drawer", !UI.drawer || UI.route === "assistant");
  $("#clock").textContent = `${WD[dow(TODAY)].slice(0, 3)} ${fmtDM(TODAY)} · ${hm(nowMin())}`;
  drawCovers(); renderThreads(); renderBell();
}
function route() { UI.route = (location.hash.match(/^#\/(\w+)/) || [, "home"])[1]; closeOverlay(); $("#view").scrollTop = 0; refresh(); $("#view").scrollTop = 0; }
window.addEventListener("hashchange", route);

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.dataset.act !== "bell") { $("#bell-pop").hidden = true; renderBell(); }
  if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case "overlay": if (e.target === el) closeOverlay(); break;
    case "close": closeOverlay(); break;
    case "go": go(d.to); break;
    case "go-day": goDay(d.d); break;
    case "drawer-open": if (UI.route !== "assistant") { UI.drawer = true; refresh(); setTimeout(() => $("#drawer textarea").focus(), 0); } break;
    case "drawer-close": UI.drawer = false; refresh(); break;
    case "ask": ask(d.q); break;
    case "covers-view": UI.coversView = d.v; refresh(); break;
    case "res": openRes(d.id); break;
    case "guest": openGuest(d.g); break;
    case "res-day": UI.resDate = addDays(UI.resDate, +d.n); refresh(); break;
    case "res-svc": UI.resSvc = d.v; refresh(); break;
    case "res-src": UI.resSrc = d.v; refresh(); break;
    case "res-view": UI.resView = d.v; refresh(); break;
    case "res-cancelled": UI.resCancelled = el.checked; refresh(); break;
    case "move": { const r = moveBooking(d.id, +d.m); refresh(); openRes(d.id, r.ok ? "" : r.message); if (r.ok) toast("Booking moved", `${d.id} · now at ${hm(+d.m)} on ${byId(d.id).table}`); break; }
    case "cancel-ask": { const r = byId(d.id); modal("Cancel this booking?", `<div class="mb"><p style="margin:0">${r.id} · ${esc(r.guest)} · ${r.party} guests · ${fmtLong(r.date)} at ${hm(r.start)}.</p><p class="muted" style="margin-bottom:0">The guest will be told the restaurant cancelled.</p></div>`, `<button class="btn" data-act="res" data-id="${r.id}">Keep it</button><button class="btn pri" data-act="cancel-do" data-id="${r.id}">Cancel booking</button>`); break; }
    case "cancel-do": { const r = cancelBooking(d.id); refresh(); openRes(d.id); if (r.ok) toast("Booking cancelled", `${d.id} · ${esc(r.r.guest)} will be told`); break; }
    case "block-dialog": blockDialog(d.d || TODAY); break;
    case "block-save": { const date = $("[data-blk=date]").value, m = +$("[data-blk=start]").value, r = blockSlot(date, m); if (!r.ok) { blockDialog(date, m, r.message); break; } closeOverlay(); refresh(); toast("Time blocked", `${hm(m)} ${dayLabel(date, m)}`); break; }
    case "unblock": { const r = unblockSlot(d.d, +d.m); refresh(); if (r.ok) toast("Time reopened", `${hm(+d.m)} ${dayLabel(d.d, +d.m)}`); break; }
    case "hours-save": { if (validateHours(hoursDraft)) break; S.services = hoursDraft.map(s => ({ ...s })); hoursDraft = null; logEvent({ type: "hours" }); refresh(); toast("Opening hours saved", S.services.map(s => `${s.name} ${hm(s.start)}–${hm(s.end)}`).join(" · ")); break; }
    case "hours-reset": hoursDraft = null; refresh(); break;
    case "floor-day": UI.floorDate = addDays(UI.floorDate, +d.n); refresh(); break;
    case "floor-time": UI.floorTime = +d.v; refresh(); break;
    case "table": openTable(d.l); break;
    case "seats": {
      const t = S.tables.find(x => x.label === d.l), n = t.seats + +d.n, need = upcomingMax(d.l);
      if (n < 1 || n > 12) { openTable(d.l, "A table seats between 1 and 12 guests."); break; }
      if (n < need) { openTable(d.l, `${d.l} has an upcoming booking for ${need}.`); break; }
      t.seats = n; logEvent({ type: "tables", text: `${d.l} now seats ${n}` }); refresh(); openTable(d.l); break;
    }
    case "table-add": { const l = "T" + (Math.max(...S.tables.map(t => tnum(t.label))) + 1); S.tables.push({ label: l, seats: 2 }); logEvent({ type: "tables", text: `Table ${l} added, 2 seats` }); refresh(); openTable(l); break; }
    case "table-remove": { S.tables = S.tables.filter(t => t.label !== d.l); logEvent({ type: "tables", text: `Table ${d.l} removed` }); closeOverlay(); refresh(); break; }
    case "maxp": { if (setMaxParty(S.maxParty + +d.n).ok) refresh(); break; }
    case "price": S.restaurant.price = d.v; refresh(); break;
    case "tag": { const t = S.restaurant.tags, i = t.indexOf(d.v); i < 0 ? t.push(d.v) : t.splice(i, 1); refresh(); break; }
    case "live": S.settings.live = !S.settings.live; refresh(); break;
    case "reset": S = initialState(); T0 = Date.now(); liveT0 = Date.now(); liveIdx = 0; hoursDraft = null; seedThread(); UI.bellSeen = { date: TODAY, min: 17 * 60 + 30 }; UI.drawer = true; refresh(); toast("Demo reset", "Saturday 31 October, 18:05, original data"); break;
    case "palette": openPalette(); break;
    case "pal": palGo(+d.i); break;
    case "bell": { const p = $("#bell-pop"); p.hidden = !p.hidden; if (!p.hidden) { UI.bellSeenPrev = UI.bellSeen; } renderBell(); if (!p.hidden) UI.bellSeen = nowAt(); break; }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.input) { UI[el.dataset.input] = el.value; refresh(); }
  if (el.dataset.pal !== undefined) { palSel = 0; palRender(el.value); }
  if (el.dataset.set) { S.restaurant[el.dataset.set] = el.value; $("#ws-name").textContent = S.restaurant.name; $("#ws-sub").textContent = `${S.restaurant.cuisine.split(" ")[0]} · ${S.restaurant.city}`; }
  if (el.tagName === "TEXTAREA") { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.hours) { hoursDraft[+el.dataset.hours][el.dataset.f] = +el.value; refresh(); }
  if (el.dataset.blk) blockDialog($("[data-blk=date]").value, el.dataset.blk === "start" ? +el.value : null);
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-chat]")) return; e.preventDefault();
  const ta = e.target.querySelector("textarea"); ask(ta.value); ta.value = ""; ta.style.height = "auto";
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") { closeOverlay(); $("#bell-pop").hidden = true; renderBell(); }
  if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.target.dataset && e.target.dataset.pal !== undefined) {
    if (e.key === "ArrowDown") { palSel = Math.min(palSel + 1, palCur.length - 1); palRender(e.target.value); e.preventDefault(); }
    if (e.key === "ArrowUp") { palSel = Math.max(palSel - 1, 0); palRender(e.target.value); e.preventDefault(); }
    if (e.key === "Enter") { e.preventDefault(); palGo(palSel); }
  }
});

/* ---------------- Live demo bookings ---------------- */
const LIVE = [
  { after: 25, guest: "Nina Brunner", date: TODAY, start: 1230, party: 2, source: "agent" },
  { after: 70, guest: "Hugo Lambert", date: addDays(TODAY, 1), start: 750, party: 4, source: "website" },
  { after: 130, guest: "Elise Kieffer", date: TODAY, start: 1200, party: 2, source: "agent" },
];
let liveIdx = 0, liveT0 = Date.now();
setInterval(() => {
  $("#clock").textContent = `${WD[dow(TODAY)].slice(0, 3)} ${fmtDM(TODAY)} · ${hm(nowMin())}`;
  const L = LIVE[liveIdx]; if (!L || !S.settings.live || (Date.now() - liveT0) / 1000 < L.after) return;
  liveIdx++;
  const r = newBooking(L.guest, L.date, L.start, L.party, L.source); if (!r) return;
  thread.push({ role: "event", rid: r.id, kind: "created", at: r.at });
  toast(`New booking · ${SRC[r.source]}`, `${esc(r.guest)} · ${r.party} guests · ${r.date === TODAY ? "tonight" : fmtShort(r.date)} ${hm(r.start)} · ${r.table}`);
  if (!document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.input) refresh();
}, 1000);

const problems = selfTest(S, NOW0);
if (problems.length) console.error("Demo data problems:", problems); else console.info("Demo data: every invariant holds.");
seedThread();
route();
</script>
