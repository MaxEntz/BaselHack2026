[project]
name = "merchant-node"
version = "0.1.0"
description = "The BATP node that serves the merchant agents on port 4710."
requires-python = ">=3.12,<3.13"
dependencies = [
    "core",
    "agent",
    "gateway",
    "batp",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
