[project]
name = "core"
version = "0.1.0"
description = "Shared models, DB access, availability rules and error codes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3.2",
    "alembic>=1.20",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
