# Drop-in for Caddy's own unit, installed by make deploy as
# /etc/systemd/system/caddy.service.d/merchant-agents.conf (ADR-0019).
# The gateway's site block adds GATEWAY_TOKEN for Anthropic's range ({env.GATEWAY_TOKEN}).
# systemd reads caddy.env as root, so it stays root:root 600; make deploy writes it with the
# token the gateway loads from code/.env (scripts/caddy_env.py), so the two never differ.
[Service]
EnvironmentFile=/opt/merchant-agents/caddy.env
