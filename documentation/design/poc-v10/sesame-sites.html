<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Petit Zinc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&display=swap">
<style>
/* The management site of each restaurant. Same pages and same rules, three shells (top tabs, sidebar, masthead).
   Every colour and typeface is set from the restaurant's look in the script; the values come from code/sites. */
:root { color-scheme: light; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --seed: #c96f4a; --seed-vein: #f6dfd2; --pad: clamp(16px, 2.4vw, 32px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, dl, dd, pre { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: var(--ac); text-underline-offset: .18em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); }
code { font: 400 13px/1.4 var(--mono); overflow-wrap: anywhere; }
.chev { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seed-sym { position: absolute; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 13px; border: 1px solid var(--ln2); border-radius: var(--rb); background: var(--sf); font-weight: 600; font-size: 13px; line-height: 1; white-space: nowrap; }
.btn:hover { background: var(--sf2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--ac); border-color: var(--ac); color: var(--on); }
.btn.pri:hover:not(:disabled) { filter: brightness(.92); }
.btn.danger { border-color: var(--bad); background: none; color: var(--bad); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--sf2); }
.btn.icon { width: 34px; padding: 0; }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 12px; }
.field { display: grid; align-content: start; gap: 4px; min-width: 0; font-weight: 600; font-size: 13px; }
.field small { font-weight: 400; color: var(--mut); }
input[type="text"], input[type="search"], input[type="number"], input[type="time"], input[type="url"], input[type="date"], select, textarea { width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--ln2); border-radius: var(--r); background: var(--sf); font-weight: 400; font-size: 14px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ac); outline-offset: -1px; }
input[readonly] { background: var(--sf2); color: var(--mut); }
.seg { display: inline-flex; border: 1px solid var(--ln2); border-radius: var(--rb); overflow: hidden; background: var(--sf); }
.seg button { min-height: 32px; padding: 0 13px; border: 0; background: none; font-weight: 600; font-size: 13px; color: var(--mut); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ln2); }
.seg button[aria-pressed="true"] { background: var(--ac); color: var(--on); }

/* Account switcher */
.acct { position: relative; }
.acct summary { display: inline-flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; }
.acct summary::-webkit-details-marker { display: none; }
.acct-name { font-family: var(--disp); font-weight: var(--dw); font-size: var(--brand-size, 22px); letter-spacing: var(--brand-track, 0); text-transform: var(--brand-case, none); color: var(--brand); line-height: 1.1; white-space: nowrap; }
.acct .chev { color: var(--brand); }
.acct-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; display: grid; min-width: 250px; padding: 6px; border: 1px solid var(--ln2); border-radius: var(--r); background: var(--sf); color: var(--ink); box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
.acct-menu p { padding: 6px 8px 4px; font-size: 12px; color: var(--mut); }
.acct-menu a { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r); color: inherit; text-decoration: none; font-weight: 600; }
.acct-menu a:hover, .acct-menu a[aria-current="true"] { background: var(--sf2); }
.acct-menu i { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .15); }
.acct-menu small { display: block; font-weight: 400; color: var(--mut); }

/* Shell: top tabs */
.band { height: 10px; background-color: var(--sf); background-image: linear-gradient(90deg, color-mix(in srgb, var(--ac) 50%, transparent) 50%, transparent 0), linear-gradient(color-mix(in srgb, var(--ac) 50%, transparent) 50%, transparent 0); background-size: 10px 10px; }
.hd { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 6px clamp(16px, 3vw, 40px); padding: 10px var(--pad) 0; background: var(--nav-bg); color: var(--nav-ink); border-bottom: 1px solid var(--ln); }
.tabs { display: flex; gap: clamp(14px, 2vw, 24px); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 8px 0 10px; border-bottom: 2px solid transparent; color: var(--nav-mut); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--nav-ink); }
.tabs a[aria-current="page"] { border-color: var(--nav-act); color: var(--nav-ink); }
.hd-r { display: flex; align-items: center; gap: 14px; margin-left: auto; padding-bottom: 8px; font-size: 13px; color: var(--nav-mut); white-space: nowrap; }
.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.state.off i { background: var(--bad); }

/* Shell: sidebar */
.with-side { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.sb { position: sticky; top: 0; display: flex; flex-direction: column; gap: 18px; height: 100vh; padding: 18px 12px; background: var(--nav-bg); color: var(--nav-ink); }
.sb .acct { padding-inline: 10px; }
.sb nav { display: grid; gap: 2px; }
.sb nav a { padding: 9px 12px; border-radius: var(--rb); color: var(--nav-mut); font-weight: 600; font-size: 14px; text-decoration: none; }
.sb nav a:hover { color: var(--nav-ink); background: color-mix(in srgb, var(--nav-act) 45%, transparent); }
.sb nav a[aria-current="page"] { background: var(--nav-act); color: var(--nav-ink); }
.sb-foot { display: grid; gap: 4px; margin-top: auto; padding-inline: 12px; font-size: 13px; color: var(--nav-mut); }
.sb .state i { background: var(--sprout, var(--ok)); }

/* Shell: masthead */
.mast { display: grid; justify-items: center; gap: 12px; padding: 22px var(--pad) 0; background: var(--nav-bg); border-bottom: 1px solid var(--ln); text-align: center; }
.mast-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; width: 100%; }
.mast-row > :first-child { justify-self: start; }
.mast-row > :last-child { justify-self: end; }
.mast .acct-menu { left: 50%; transform: translateX(-50%); text-align: left; }
.mast .tabs { max-width: 100%; gap: clamp(16px, 3vw, 36px); }
.mast .tabs a { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.mast .clock, .mast .state { font-size: 13px; color: var(--nav-mut); }

/* Page */
.pg { display: grid; gap: 16px; padding: 20px var(--pad) 28px; max-width: 1560px; margin-inline: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bar-r { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.date-nav { display: inline-flex; align-items: center; gap: 4px; }
.date-nav strong { min-width: 112px; padding-inline: 6px; font-family: var(--disp); font-weight: var(--dw); font-size: 19px; text-align: center; white-space: nowrap; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--mut); }
.sum b { color: var(--ink); font-size: 15px; font-weight: 600; }
.sum em { font-style: normal; color: var(--bad); font-weight: 600; }
.panel { min-width: 0; border: 1px solid var(--ln); border-radius: var(--r); background: var(--sf); }
.panel-hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--ln); }
.panel-hd h2 { font-family: var(--disp); font-weight: var(--dw); font-size: 17px; line-height: 1.2; }
.ttl { display: grid; gap: 4px; }
.ttl h1 { font-family: var(--disp); font-weight: var(--dw); font-size: 26px; line-height: 1.15; }
.ttl p { max-width: 62ch; color: var(--mut); }

/* Service: bookings grouped by time, floor beside them */
.svc { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.grp { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 5px; }
.grp + .row { border-top: 0; }
.grp b { font-family: var(--disp); font-weight: var(--dw); font-size: 15px; font-variant-numeric: tabular-nums; }
.grp span { font-size: 12px; color: var(--mut); }
.grp.blocked b { text-decoration: line-through; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 26px 46px; align-items: center; gap: 10px; width: 100%; padding: 8px 14px; border: 0; border-top: 1px solid var(--ln); background: none; text-align: left; }
.row:hover { background: var(--sf2); }
.row-name { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { display: block; font-size: 12px; color: var(--mut); }
.row small.claude { color: var(--ac); font-weight: 600; }
.row-party { font-size: 16px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.row-table { padding: 6px 0; border-radius: min(var(--r), 6px); background: var(--sf2); font-size: 13px; font-weight: 600; text-align: center; }
.row.off .row-name, .row.off .row-party, .row.off .row-table { color: var(--mut); text-decoration: line-through; }
.row.fresh, tr.fresh td { animation: fresh 3.2s ease-out; }
@keyframes fresh { 0%, 45% { background: color-mix(in srgb, var(--ac) 26%, transparent); } 100% { background: transparent; } }
.empty { padding: 30px 16px; color: var(--mut); text-align: center; }
.empty b { display: block; margin-bottom: 2px; color: var(--ink); font-size: 15px; }

.room { position: sticky; top: 16px; padding: 14px 16px 18px; border: var(--floor-bd); border-radius: var(--r); background: var(--floor-bg); color: var(--floor-ink); }
body[data-shell="tabs"] .room { top: 72px; }
.room-hd { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
.room-hd h2 { font-family: var(--disp); font-weight: var(--dw); font-size: 17px; font-style: var(--floor-title, normal); }
.room-hd span { font-size: 13px; color: var(--floor-mut); }
.at { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.at button { min-height: 28px; padding: 0 9px; border: 1px solid var(--floor-ln); border-radius: min(var(--r), 6px); background: none; color: var(--floor-ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.at button[aria-pressed="true"] { background: var(--occ); border-color: var(--occ); color: var(--occ-ink); }
.at button.off { color: var(--floor-mut); text-decoration: line-through; border-style: dashed; }
.floor { display: grid; gap: 14px; }
.floor-row { display: flex; flex-wrap: wrap; gap: 12px; }
.tb { display: grid; place-content: center; gap: 1px; width: 86px; min-height: 66px; padding: 4px; border: 1.5px solid var(--floor-ln); border-radius: var(--tbr); background: none; color: var(--floor-ink); text-align: center; line-height: 1.15; }
.tb:hover { border-color: var(--floor-ink); }
.tb b { font-size: 13px; font-weight: 700; }
.tb small { max-width: 100%; font-size: 11px; color: var(--floor-mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb.s2 { width: 74px; }
.tb.s4 { width: 104px; }
.tb.s6 { width: 158px; }
.tb.busy { background: var(--occ); border-color: var(--occ); color: var(--occ-ink); }
.tb.busy small { color: inherit; }
.tb.soon { border-style: dashed; border-color: var(--floor-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 14px; font-size: 12px; color: var(--floor-mut); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 1.5px solid var(--floor-ln); border-radius: 2px; }
.legend i.f { background: var(--occ); border-color: var(--occ); }
.legend i.d { border-style: dashed; border-color: var(--floor-ink); }

/* Timeline */
.tl-wrap { overflow-x: auto; border: 1px solid var(--ln); border-radius: var(--r); background: var(--sf); }
.tl { position: relative; min-width: 820px; --label: 86px; }
.tl-row { display: grid; grid-template-columns: var(--label) repeat(var(--cols), minmax(0, 1fr)); min-height: 42px; border-top: 1px solid var(--ln); }
.tl-row.head { position: sticky; top: 0; min-height: 32px; border-top: 0; font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; }
.tl-row.head span { grid-row: 1; align-self: center; padding-left: 5px; }
.tl-row.head span.off { color: var(--bad); font-weight: 600; text-decoration: line-through; }
.tl-label { grid-column: 1; grid-row: 1; align-self: center; padding-inline: 12px; font-weight: 600; font-size: 13px; }
.tl-label small { font-weight: 400; font-size: 11px; color: var(--mut); }
.tl-cell { grid-row: 1; border: 0; border-left: 1px solid var(--ln); background: none; padding: 0; }
.tl-cell:hover { background: var(--sf2); }
.tl-cell.nobook { cursor: default; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--sf2) 4px 8px); }
.tl-cell.off { cursor: not-allowed; background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--bad) 22%, transparent) 4px 8px); }
.tl-block { z-index: 1; grid-row: 1; align-self: center; height: 32px; margin-inline: 2px; padding: 0 8px; overflow: hidden; border: 1px solid var(--ac); border-radius: min(var(--r), 6px); background: color-mix(in srgb, var(--ac) 12%, var(--sf)); color: var(--ink); font-size: 12px; font-weight: 600; line-height: 30px; text-align: left; white-space: nowrap; text-overflow: ellipsis; }
.tl-block:hover { filter: brightness(.96); }
.tl-block.claude { background: var(--ac); color: var(--on); }
.tl-block.fresh { animation: pulse 1.1s ease-out 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 35%, transparent); } }
.tl-now { position: absolute; z-index: 2; top: 0; bottom: 0; left: calc(var(--label) + (100% - var(--label)) * var(--now)); width: 2px; background: var(--bad); pointer-events: none; }
.tl-now::before { content: attr(data-t); position: absolute; top: 7px; left: 4px; padding: 0 4px; border-radius: 3px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; }
.tl-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--mut); }
.tl-key i { display: inline-block; width: 14px; height: 12px; margin-right: 5px; vertical-align: -2px; border: 1px solid var(--ac); border-radius: 2px; background: color-mix(in srgb, var(--ac) 12%, var(--sf)); }
.tl-key i.c { background: var(--ac); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th { padding: 9px 14px; border-bottom: 1px solid var(--ln); color: var(--mut); font-weight: 600; font-size: 12px; text-align: left; white-space: nowrap; }
.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td, .tbl tbody tr[aria-selected="true"] td { background: var(--sf2); }
.tbl .link { padding: 0; border: 0; background: none; font-weight: 600; text-align: left; }
.tbl .link:hover { text-decoration: underline; text-underline-offset: .18em; }
.tbl tr.off .link, .tbl tr.off td.dim { color: var(--mut); text-decoration: line-through; }
.tag { display: inline-block; padding: 1px 7px; border-radius: min(var(--rb), 4px); background: var(--sf2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag.claude { background: color-mix(in srgb, var(--ac) 16%, transparent); color: var(--ac); }
.tag.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--ln); }
.filters input[type="search"] { flex: 1 1 200px; max-width: 320px; }
.filters select { width: auto; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--ln); font-size: 13px; color: var(--mut); }
.pager div { display: flex; gap: 6px; }

/* Agent */
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--ln); }
.kv:first-child { border-top: 0; }
.kv > span { color: var(--mut); font-size: 13px; }
.log-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.frame { display: grid; gap: 10px; padding: 14px; }
.frame h3 { font-size: 12px; font-weight: 600; color: var(--mut); }
.frame pre { padding: 10px 12px; overflow-x: auto; border-radius: min(var(--r), 6px); background: var(--sf2); font: 400 12.5px/1.5 var(--mono); }
.frame-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--mut); }
.tools li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 2px 12px; padding: 9px 14px; border-top: 1px solid var(--ln); }
.tools li:first-child { border-top: 0; }

/* Settings */
.set { display: grid; gap: 16px; max-width: 860px; }
.set-sec { display: grid; gap: 14px; padding: 16px; }
.set-sec > h2 { font-family: var(--disp); font-weight: var(--dw); font-size: 17px; line-height: 1.2; }
.set-sec > p { margin-top: -10px; color: var(--mut); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.svc-row { display: grid; grid-template-columns: 90px 120px 120px 1fr; align-items: center; gap: 8px; }
#tb-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 20px; }
.tb-row { display: grid; grid-template-columns: 34px 72px auto; align-items: center; justify-content: start; gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 400; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.swatches i { width: 26px; height: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(127 127 127 / .35); }
.colour { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; }
input[type="color"] { width: 44px; height: 32px; padding: 2px; border: 1px solid var(--ln2); border-radius: 4px; background: var(--sf); }
.savebar { position: sticky; bottom: 12px; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: var(--r); background: var(--ink); color: var(--bg); box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.savebar b { font-weight: 600; }
.savebar span { flex: 1 1 200px; font-size: 13px; }
.savebar .btn { background: transparent; border-color: currentColor; color: inherit; }
.savebar .btn.pri { background: var(--bg); border-color: var(--bg); color: var(--ink); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }

/* Dialogs */
dialog { width: min(440px, calc(100vw - 24px)); padding: 0; border: 1px solid var(--ln2); border-radius: var(--r); background: var(--sf); color: var(--ink); box-shadow: 0 16px 48px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog.drawer { width: min(400px, 100vw); height: 100dvh; max-height: none; margin: 0 0 0 auto; border-width: 0 0 0 1px; border-radius: 0; }
.dlg { display: grid; gap: 14px; padding: 18px; }
.dlg-hd { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.dlg h2 { font-family: var(--disp); font-weight: var(--dw); font-size: 21px; line-height: 1.15; }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.facts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 7px 12px; }
.facts dt { color: var(--mut); font-size: 13px; }
.facts dd { font-variant-numeric: tabular-nums; }
.note { padding: 9px 12px; border-radius: min(var(--r), 6px); background: var(--sf2); font-size: 13px; }
.note.bad { color: var(--bad); }
.block-times { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; }
.block-times label { display: grid; place-items: center; min-height: 34px; border: 1px solid var(--ln2); border-radius: min(var(--r), 6px); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer; }
.block-times input { position: absolute; opacity: 0; }
.block-times input:checked + span { color: var(--on); }

  const err = !name ? 'Your restaurant needs a name.' : !(max >= 1) ? 'The largest group has to be at least 1.' : !dr.tables.length ? 'Keep at least one table.' : dr.tables.some(t => !(t.seats >= 1)) ? 'Every table needs at least 1 seat.' : validateServices(dr.services);
  if (err) { ui.err = err; $('#save-err').textContent = err; return; }
  Object.assign(d, { name, city: $('#s-city').value.trim(), price: $('#s-price').value, maxParty: max, fallback: $('#s-fallback').value.trim() || d.fallback, policy: $('#s-policy').value.trim(), tags: $$('[data-tag]:checked').map(x => x.dataset.tag), services: structuredClone(dr.services), tables: structuredClone(dr.tables) });
  const picked = $('#s-colour').value;
  let note = 'Saved. Claude reads the new rules now.';
  if (picked.toLowerCase() !== d.look.ac.toLowerCase()) {
    const used = setAccent(d, picked);
    if (used !== picked.toLowerCase()) note = `Saved. ${picked} was too faint, so Sésame used ${used}.`;
    applyLook(d);
  }
  ui.draft = null; ui.dirty = false; ui.err = '';
  render();
  toast(note);
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
const closeBtn = `<button type="button" class="btn icon quiet" data-act="close" aria-label="Close">${chev('x')}</button>`;
function showDialog(html, cls = '') { dlg.className = cls; dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function openBooking(id, confirming) {
  const d = D(), b = d.bookings.find(x => x.id === id); if (!b) return;
  const sv = svcOf(d, b.time);
  const alts = allStarts(d).filter(t => t !== b.time && !isBlocked(d, b.day, t) && pickTable(d, b.day, b.party, t, b));
  const nearest = [...alts].sort((x, y) => Math.abs(toMin(x) - toMin(b.time)) - Math.abs(toMin(y) - toMin(b.time)))[0];
  const facts = [['Reference', b.id], ['Date', dayFmt(b.day, { weekday: 'long', day: 'numeric', month: 'long' })], ['Time', `${b.time}–${toHM(toMin(b.time) + SLOT)}${sv ? ` (${sv.name.toLowerCase()})` : ''}`], [cap(d.words[1]), b.party], ['Table', b.table], ['Booked by', b.via === 'claude' ? 'Claude, confirmed with the guest' : b.via === 'website' ? 'Your website' : 'You'], ['Booked on', `${dayShort(b.created.d)}, ${b.created.t}`], ['Status', live(b) ? '<span class="tag ok">Confirmed</span>' : `<span class="tag bad">Cancelled by ${b.by === 'guest' ? 'the guest' : 'you'}</span>`]];
  showDialog(`<div class="dlg"><div class="dlg-hd"><h2 id="dlg-title">${esc(b.guest)}</h2>${closeBtn}</div>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${typeof v === 'string' && v.startsWith('<span') ? v : esc(v)}</dd>`).join('')}</dl>
    ${live(b) ? `<form id="f-move" data-id="${b.id}" class="field">Move to another time<div style="display:flex;gap:8px"><select id="move-t" ${alts.length ? '' : 'disabled'}>${alts.length ? alts.map(t => `<option ${t === nearest ? 'selected' : ''}>${t}</option>`).join('') : '<option>No other time is free</option>'}</select><button class="btn" ${alts.length ? '' : 'disabled'}>Move</button></div></form>
    ${confirming ? `<div class="note"><b>Cancel this booking?</b> ${b.via === 'claude' ? `${esc(b.guest)} sees a notice the next time their assistant checks.` : 'The table goes back on sale straight away.'}</div><div class="dlg-foot"><button class="btn" data-act="open" data-id="${b.id}">Keep it</button><button class="btn danger" data-act="do-cancel" data-id="${b.id}">Cancel booking</button></div>` : `<div class="dlg-foot"><button class="btn danger" data-act="ask-cancel" data-id="${b.id}">Cancel booking</button></div>`}` : ''}
  </div>`, 'drawer');
}
function openNew(preset = {}) {
  const d = D(), sv = curSvc(d);
  const times = d.services.flatMap(v => startsOf(v).filter(t => !isBlocked(d, ui.day, t)).map(t => ({ t, v })));
  const pick = preset.time || (times.find(x => x.v === sv) || times[0] || {}).t;
  showDialog(`<form class="dlg" id="f-new" novalidate><div class="dlg-hd"><h2 id="dlg-title">New booking</h2>${closeBtn}</div>
    <p class="mut">${dayFmt(ui.day, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <label class="field">Guest name<input type="text" id="n-guest" autocomplete="off"></label>
    <div class="cols"><label class="field">${esc(cap(d.words[1]))}<input type="number" id="n-party" min="1" value="${preset.seats ? Math.min(2, preset.seats) : 2}"></label><label class="field">Time<select id="n-time">${times.map(x => `<option ${x.t === pick ? 'selected' : ''}>${x.t}</option>`).join('')}</select></label></div>
    <p class="note" id="n-note" role="status"></p>
    <div class="dlg-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri" id="n-add">Add booking</button></div></form>`);
  noteNew();
  $('#n-guest').focus();
}
function noteNew() {
  const d = D(), party = +$('#n-party').value, t = $('#n-time').value, note = $('#n-note');
  if (!t) { note.textContent = 'Every time is blocked on this day.'; note.classList.add('bad'); return false; }
  const lim = limit(d);
  let msg = '', ok = false;
  if (!(party >= 1)) msg = 'A booking needs at least one guest.';
  else if (party > lim) msg = `Your limit is ${lim}. Change it in Settings, or take this group another way.`;
  else {
    const tb = pickTable(d, ui.day, party, t);
    if (tb) { msg = `Table ${tb.label} (${tb.seats} seats) until ${toHM(toMin(t) + SLOT)}.`; ok = true; }
    else {
      const other = allStarts(d).filter(x => !isBlocked(d, ui.day, x) && pickTable(d, ui.day, party, x)).sort((a, b) => Math.abs(toMin(a) - toMin(t)) - Math.abs(toMin(b) - toMin(t)))[0];
      msg = other ? `No table for ${party} at ${t}. The closest free time is ${other}.` : `No table for ${party} is free on this day.`;
    }
  }
  note.textContent = msg; note.classList.toggle('bad', !ok);
  return ok;
}
function openBlock() {
  const d = D();
  showDialog(`<form class="dlg" id="f-block"><div class="dlg-hd"><h2 id="dlg-title">Block a time</h2>${closeBtn}</div>
    <p class="mut">${dayFmt(ui.day, { weekday: 'long', day: 'numeric', month: 'long' })}. Agents stop offering these times. Bookings already made stay.</p>
    ${d.services.map(v => `<fieldset style="border:0;padding:0;margin:0;display:grid;gap:6px"><legend style="padding:0 0 6px;font-weight:600">${v.name}</legend><div class="block-times">${startsOf(v).map(t => `<label><input type="checkbox" value="${t}" ${isBlocked(d, ui.day, t) ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>`).join('')}
    <div class="dlg-foot"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Save</button></div></form>`);
}

/* ---------- toasts ---------- */
function toast(text, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div>${text}</div>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) $('button', el).addEventListener('click', () => { action.run(); el.remove(); });
  $('#toasts').append(el);
  setTimeout(() => el.remove(), action ? 9000 : 3500);
}
async function copy(v) {
  try { await navigator.clipboard.writeText(v); toast('Copied'); }
  catch {
    const t = document.createElement('textarea'); t.value = v; document.body.append(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch { /* shown below */ }
    t.remove(); toast(ok ? 'Copied' : `Copy this: ${esc(v)}`);
  }
}

/* ---------- a guest books through Claude while the merchant is watching ---------- */
let liveTimer;
function armLiveBooking() {
  clearTimeout(liveTimer);
  const d = D();
  if (d.pinged || d.paused) return;
  liveTimer = setTimeout(() => {
    if (d !== D() || d.pinged || d.paused) return;
    d.pinged = true;
    const party = Math.min(2, limit(d));
    const t = allStarts(d).filter(x => toMin(x) > toMin(NOW) && !isBlocked(d, TODAY, x)).find(x => pickTable(d, TODAY, party, x));
    if (!t) return;
    const tb = pickTable(d, TODAY, party, t);
    const b = { id: nextId(d), day: TODAY, time: t, party, table: tb.label, guest: 'Kim Weber', via: 'claude', status: 'confirmed', created: { d: TODAY, t: NOW } };
    d.bookings.push(b);
    logRequest(d, NOW, 'AVAILABILITY', { date: TODAY, time: t, party_size: party }, d.slug, availability(d, TODAY, t, party), `${word(d, party)} at ${t}`, 41);
    logRequest(d, NOW, 'BOOK', { starts_at: stamp(TODAY, t), party_size: party, guest_name: b.guest, idempotency_key: 'k-live' }, d.slug, { status: 200, result: { reservation: wireRes(d, b) } }, `${b.guest}, ${t}, ${party}`, 63);
    ui.fresh = b.id;
    if (ui.page !== 'settings' && !dlg.open) render();
    toast(`<b>New booking via Claude</b>${esc(b.guest)}, ${t}, ${word(d, party)}, ${esc(tb.label)}`, { label: 'View', run: () => openBooking(b.id) });
  }, 6000);
}

/* ---------- routing and rendering ---------- */
function render() {
  const d = D();
  applyLook(d);
  const body = { service: pageService, timeline: pageTimeline, bookings: pageBookings, agent: pageAgent, settings: pageSettings }[ui.page](d);
  $('#app').innerHTML = shell(d, body);
  document.title = `${d.name} · ${PAGES.find(p => p[0] === ui.page)[1]}`;
}
function route() {
  const [site, page] = location.hash.slice(1).split('/');
  const nextSite = SITES[site] ? site : ui.site;
  const nextPage = PAGES.some(p => p[0] === page) ? page : (SITES[site] ? 'service' : ui.page);
  if (nextSite !== ui.site) Object.assign(ui, { day: TODAY, svc: null, at: null, q: '', src: '', st: '', pg: 0, logSel: null, logFilter: 'all', fresh: null });
  if (nextSite !== ui.site || nextPage !== ui.page) Object.assign(ui, { draft: null, dirty: false, err: '' });
  ui.site = nextSite; ui.page = nextPage;
  if (dlg.open) dlg.close();
  render();
  scrollTo(0, 0);
  armLiveBooking();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  $$('details.acct[open]').forEach(x => { if (!x.contains(e.target) || e.target.closest('.acct-menu a')) x.open = false; });
  if (e.target === dlg) { dlg.close(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = D(), a = el.dataset.act;
  if (a === 'day') { ui.day = addDays(ui.day, +el.dataset.n); ui.at = null; ui.fresh = null; render(); }
  else if (a === 'today') { ui.day = TODAY; ui.at = null; render(); }
  else if (a === 'svc') { ui.svc = el.dataset.v; ui.at = null; render(); }
  else if (a === 'at') { ui.at = el.dataset.t; render(); }
  else if (a === 'open') { openBooking(el.dataset.id); }
  else if (a === 'table') {
    const at = toMin(ui.at), b = bookingsIn(d, ui.day, curSvc(d)).find(x => live(x) && x.table === el.dataset.t && toMin(x.time) <= at && at < toMin(x.time) + SLOT);
    if (b) openBooking(b.id);
    else if (isBlocked(d, ui.day, ui.at)) toast(`${ui.at} is blocked.`);
    else openNew({ time: ui.at, seats: d.tables.find(t => t.label === el.dataset.t).seats });
  }
  else if (a === 'cell') { openNew({ time: el.dataset.t, seats: d.tables.find(t => t.label === el.dataset.table).seats }); }
  else if (a === 'new') { openNew(); }
  else if (a === 'block') { openBlock(); }
  else if (a === 'close') { dlg.close(); }
  else if (a === 'ask-cancel') { openBooking(el.dataset.id, true); }
  else if (a === 'do-cancel') {
    const b = d.bookings.find(x => x.id === el.dataset.id);
    b.status = 'cancelled'; b.by = 'merchant';
    dlg.close(); render();
    toast(`<b>${esc(b.id)} cancelled</b>${esc(b.table)} is free again.${b.via === 'claude' ? ' The guest sees a notice next time their assistant checks.' : ''}`);
  }
  else if (a === 'pg') { ui.pg += +el.dataset.n; $('#bk-body').innerHTML = bookingsBody(d); }
  else if (a === 'copy') { copy(el.dataset.v); }
  else if (a === 'pause') { d.paused = !d.paused; if (d.paused) clearTimeout(liveTimer); else armLiveBooking(); render(); toast(d.paused ? 'Agent paused. Guests are sent to your booking page.' : 'Agent live again.'); }
  else if (a === 'log') { ui.logSel = el.dataset.k; render(); }
  else if (a === 'logf') { ui.logFilter = el.dataset.v; const f = d.logs.filter(l => ui.logFilter === 'all' || l.status >= 400); ui.logSel = f[0] && f[0].key; render(); }
  else if (a === 'add-table') {
    const dr = ui.draft, num = Math.max(0, ...dr.tables.map(t => +t.label.slice(1) || 0)) + 1;
    dr.tables.push({ label: `T${num}`, seats: 4 }); refreshTables(); markDirty();
  }
  else if (a === 'rm-table') {
    const dr = ui.draft, t = dr.tables[+el.dataset.i], used = d.bookings.find(b => b.table === t.label), err = $('#tb-err');
    if (used) { err.hidden = false; err.textContent = `${t.label} can't go, because ${used.guest}'s booking (${used.id}) refers to it.`; return; }
    dr.tables.splice(+el.dataset.i, 1); refreshTables(); markDirty();
  }
  else if (a === 'discard') { ui.draft = null; ui.dirty = false; ui.err = ''; render(); }
});
function refreshTables() {
  const dr = ui.draft;
  $('#tb-body').innerHTML = tableRows(dr);
  $('#tb-sum').textContent = `${dr.tables.length} tables, ${dr.tables.reduce((n, t) => n + t.seats, 0)} seats.`;
  $('#tb-err').hidden = true;
}
function markDirty() { ui.dirty = true; const b = $('#savebar'); if (b) b.hidden = false; }
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { ui.q = el.value; ui.pg = 0; $('#bk-body').innerHTML = bookingsBody(D()); return; }
  if (el.dataset.filter) { ui[el.dataset.filter] = el.value; ui.pg = 0; $('#bk-body').innerHTML = bookingsBody(D()); return; }
  if (el.id === 'n-party' || el.id === 'n-time') { noteNew(); return; }
  if (el.closest('#settings')) {
    if (el.dataset.sv !== undefined) ui.draft.services[+el.dataset.sv][el.dataset.k] = el.value;
    if (el.dataset.tb !== undefined) { ui.draft.tables[+el.dataset.tb].seats = +el.value; $('#tb-sum').textContent = `${ui.draft.tables.length} tables, ${ui.draft.tables.reduce((n, t) => n + t.seats, 0)} seats.`; }
    if (el.id === 's-colour') el.nextElementSibling.textContent = el.value;
    markDirty();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, d = D();
  if (f.id === 'settings') return saveSettings();
  if (f.id === 'f-new') {
    const guest = $('#n-guest').value.trim(), note = $('#n-note');
    if (!guest) { note.textContent = 'Add the guest\'s name.'; note.classList.add('bad'); $('#n-guest').focus(); return; }
    if (!noteNew()) return;
    const party = +$('#n-party').value, t = $('#n-time').value, tb = pickTable(d, ui.day, party, t);
    const b = { id: nextId(d), day: ui.day, time: t, party, table: tb.label, guest, via: 'merchant', status: 'confirmed', created: { d: TODAY, t: NOW } };
    d.bookings.push(b);
    ui.fresh = b.id;
    const v = svcOf(d, t); if (v) ui.svc = v.name;
    dlg.close(); render();
    toast(`<b>${b.id} added</b>${esc(guest)}, ${t}, ${esc(tb.label)}`);
  }
  if (f.id === 'f-block') {
    const on = new Set($$('input:checked', f).map(x => x.value));
    allStarts(d).forEach(t => { const k = `${ui.day} ${t}`; if (on.has(t)) d.blocked.add(k); else d.blocked.delete(k); });
    dlg.close(); render();
    toast(on.size ? `Blocked ${[...on].sort().join(', ')}. Agents stop offering ${on.size === 1 ? 'it' : 'them'}.` : 'No time is blocked on this day.');
  }
  if (f.id === 'f-move') {
    const b = d.bookings.find(x => x.id === f.dataset.id), t = $('#move-t').value, tb = pickTable(d, b.day, b.party, t, b);
    if (!tb) return;
    b.time = t; b.table = tb.label; ui.fresh = b.id;
    const v = svcOf(d, t); if (v) ui.svc = v.name;
    dlg.close(); render();
    toast(`<b>${b.id} moved</b>${esc(b.guest)}, ${t}, ${esc(tb.label)}`);
  }
});
addEventListener('hashchange', route);
route();
})();
</script>
