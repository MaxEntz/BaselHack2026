<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sésame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700;900&display=swap">
<style>
/* Layout: the page is the conversation. It starts centred, and makes room for a gray pasteboard once there is a site to show.
   The chrome stays neutral so that the only colour on screen is the merchant's own. The agent site has no look at all. */
:root {
  --bg: #fff; --bg-2: #f4f4f4; --bg-3: #e8e8e8; --paste: #dcdcdc;
  --ink: #111; --ink-2: #474747; --ink-3: #686868;
  --line: #d9d9d9; --line-2: #a8a8a8;
  --pri: #111; --on-pri: #fff;
  --sel: #2f5bff; --on-sel: #fff;
  --ok: #0b7a43; --warn: #955000; --bad: #c0262e;
  --seed: #c96f4a; --seed-vein: #f6dfd2;
  --lift: 0 1px 2px rgb(0 0 0 / .14), 0 10px 28px rgb(0 0 0 / .14);
  --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  --mono: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace;
  --logo: "Gloock", Georgia, serif;
  --gut: clamp(16px, 3.4vw, 56px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1b; --bg-2: #262626; --bg-3: #333; --paste: #101010;
    --ink: #f5f5f5; --ink-2: #c9c9c9; --ink-3: #a0a0a0;
    --line: #3a3a3a; --line-2: #666;
    --pri: #f5f5f5; --on-pri: #111;
    --sel: #86a2ff; --on-sel: #0a1238;
    --ok: #55c98f; --warn: #eaa84c; --bad: #ff8585;
    --seed: #e08a66;
    --lift: 0 1px 2px rgb(0 0 0 / .5), 0 10px 28px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1b; --bg-2: #262626; --bg-3: #333; --paste: #101010;
  --ink: #f5f5f5; --ink-2: #c9c9c9; --ink-3: #a0a0a0;
  --line: #3a3a3a; --line-2: #666;
  --pri: #f5f5f5; --on-pri: #111;
  --sel: #86a2ff; --on-sel: #0a1238;
  --ok: #55c98f; --warn: #eaa84c; --bad: #ff8585;
  --seed: #e08a66;
  --lift: 0 1px 2px rgb(0 0 0 / .5), 0 10px 28px rgb(0 0 0 / .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 1.125rem/1.45 var(--sans); }
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ico { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* Wordmark rebuilt in Gloock until the vector file exists; the seed colour stays a token. */
.logo { display: inline-block; font-family: var(--logo); font-weight: 400; line-height: 1; white-space: nowrap; color: var(--ink); text-decoration: none; }
.acc { position: relative; }
.acc svg { position: absolute; left: .19em; top: .15em; width: .19em; height: .26em; overflow: visible; color: var(--seed); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 44px; padding: 0 1.25em; border-radius: 999px; font-weight: 700; font-size: 1.0625rem; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.btn.pri { background: var(--pri); color: var(--on-pri); }
.btn.pri:not(:disabled):hover { background: var(--ink-2); }
.btn.out { border: 2px solid var(--ink); }
.btn.out:hover { background: var(--ink); color: var(--bg); }
.btn.sm { min-height: 34px; font-size: .9375rem; padding: 0 1em; }
.btn.pri:disabled, .btn:disabled { background: var(--bg-3); color: var(--ink-3); border-color: transparent; }
.chip { display: inline-flex; align-items: center; min-height: 34px; padding: 0 .85em; border: 1px solid var(--line-2); border-radius: 999px; font-size: .9375rem; font-weight: 600; text-align: left; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--ink); background: var(--bg-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* App tiles: two letters per site, in the merchant's own colour once one is known. */
.app { display: inline-grid; place-items: center; width: var(--s, 44px); height: var(--s, 44px); flex: none; border-radius: calc(var(--s, 44px) * .22); background: var(--app-bg, var(--pri)); color: var(--app-ink, var(--on-pri)); font: 700 calc(var(--s, 44px) * .44)/1 var(--sans); letter-spacing: -.01em; }

.dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18); }
.dots { display: inline-flex; gap: 3px; }

/* ---------- Studio ---------- */
#studio { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.st-top { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
.st-top .logo { font-size: 1.5rem; }
.st-sep { width: 1px; height: 22px; background: var(--line-2); }
.st-name { flex: 0 1 auto; min-width: 0; font-weight: 700; font-size: 1.0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg-3); color: var(--ink-2); font-size: .875rem; font-weight: 600; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.status.live { color: var(--ok); }
.status.live i { background: var(--ok); }
.st-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#st-new { display: none; }

.st-body { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 0; }
#studio[data-split="1"] .st-body { grid-template-columns: 76px minmax(380px, 40%) minmax(0, 1fr); }
.rail { display: flex; flex-direction: column; gap: 8px; padding: 12px 6px; border-right: 1px solid var(--line); overflow-y: auto; }
.rail button { display: grid; justify-items: center; gap: 4px; padding: 6px 2px; border-radius: 10px; font-size: .75rem; font-weight: 600; line-height: 1.1; text-align: center; --s: 36px; }
.rail button:hover { background: var(--bg-2); }
.rail button[aria-current="true"] { background: var(--bg-3); }
.rail-label { padding-top: 8px; border-top: 1px solid var(--line); font-size: .6875rem; color: var(--ink-3); text-align: center; }
.app.plus { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-2); font-weight: 400; }
.pane-switch { display: none; }
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
#studio[data-split="1"] .chat { border-right: 1px solid var(--line); }
#studio[data-split="0"] #feed { padding-inline: max(20px, calc((100% - 780px) / 2)); }
#studio[data-split="0"] .composer { padding-inline: max(16px, calc((100% - 780px) / 2)); }
.chat[data-empty] { grid-template-rows: auto auto; align-content: center; }
.chat[data-empty] #feed { overflow: visible; padding-block: 0 20px; }
.chat[data-empty] .box { padding: 14px 12px 12px 18px; border-color: var(--ink); border-radius: 20px; }
.chat[data-empty] .box textarea { min-height: 3em; font-size: 1.25rem; }
.chat[data-empty] .send { width: 44px; height: 44px; }
.hello { display: grid; gap: 14px; }
.hello h1 { font-weight: 900; font-size: clamp(2.5rem, 5.4vw, 4.75rem); line-height: .98; letter-spacing: -.028em; text-wrap: balance; }
.hello p { font-size: clamp(1.1875rem, 1.6vw, 1.4375rem); line-height: 1.32; color: var(--ink-2); max-width: 34em; }
#feed { display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 8px; overflow-y: auto; overscroll-behavior: contain; font-size: 1.0625rem; line-height: 1.42; }
.msg { min-width: 0; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; max-width: 86%; padding: 9px 14px; border-radius: 18px 18px 4px 18px; background: var(--bg-3); white-space: pre-wrap; }
.msg.bot { align-self: stretch; }
.thinking { color: var(--ink-3); font-size: 1rem; }
.card { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); font-size: 1rem; }
.card > h3 { padding: 10px 14px 8px; font-size: 1rem; font-weight: 700; }
.step { display: grid; grid-template-columns: 20px 1fr; gap: 2px 8px; padding: 7px 14px; border-top: 1px solid var(--line); align-items: start; }
.step .tick { width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; color: var(--bg); }
.step.run .tick { border-color: var(--ink) transparent var(--ink) var(--ink); animation: spin .8s linear infinite; }
.step.done .tick { background: var(--ok); border-color: var(--ok); }
.step.wait .tick { border-style: dashed; }
.step .tick svg { width: 10px; height: 10px; stroke-width: 3.4; }
.step b { font-weight: 600; }
.step code { font: 600 .875rem var(--mono); }
.step p { grid-column: 2; color: var(--ink-2); font-size: .9375rem; line-height: 1.3; overflow-wrap: anywhere; }
@keyframes spin { to { transform: rotate(360deg); } }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; width: 100%; padding: 8px 14px; border-top: 1px solid var(--line); text-align: left; align-items: baseline; }
button.fact:hover { background: var(--bg-2); }
.fact small { grid-column: 1 / -1; font-size: .8125rem; color: var(--ink-3); }
.fact span { min-width: 0; }
.fact em { font: 400 .8125rem var(--mono); color: var(--ink-3); white-space: nowrap; }
.fact[aria-pressed="true"] { background: var(--bg-2); box-shadow: inset 3px 0 0 var(--sel); }
.flag { display: grid; gap: 2px; padding: 8px 14px; border-top: 1px solid var(--line); line-height: 1.3; }
.flag b { font-weight: 600; }
.flag span { color: var(--ink-2); font-size: .9375rem; }
.opens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.open-site { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; text-align: left; align-items: center; --s: 36px; }
.open-site:hover { border-color: var(--ink); }
.open-site b { font-weight: 700; font-size: 1rem; line-height: 1.15; }
.diff { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 9px 14px; }
.diff s { color: var(--ink-3); }
.diff b { font-weight: 700; }
.diff button { margin-left: auto; font-size: .9375rem; font-weight: 600; text-decoration: underline; text-underline-offset: .2em; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.tbl td { padding: 7px 8px; border-top: 1px solid var(--line); }
.tbl td:first-child { padding-left: 14px; font-weight: 700; }
.tbl td:last-child { padding-right: 14px; text-align: right; color: var(--ink-2); }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.nums div { padding: 10px 14px; }
.nums b { display: block; font-size: 1.75rem; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
.nums small { font-size: .875rem; color: var(--ink-2); }
.ping { display: grid; gap: 2px; padding: 12px 14px; border-radius: 14px; background: var(--ping-bg, var(--pri)); color: var(--ping-ink, var(--on-pri)); }
.ping small { font-size: .875rem; opacity: .85; }
.ping b { font-size: 1.1875rem; font-weight: 700; line-height: 1.2; }
.url { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); }
.url small { grid-column: 1; font-size: .875rem; color: var(--ink-2); }
.url code { grid-column: 1; font: 400 .8125rem/1.3 var(--mono); overflow-wrap: anywhere; }
.url button { grid-column: 2; grid-row: 1 / span 2; padding: 6px; border-radius: 8px; }
.url button:hover { background: var(--bg-3); }

.composer { display: grid; gap: 8px; padding: 10px 16px 12px; background: var(--bg); }
#chips { display: flex; gap: 6px; margin-inline: -16px; padding-inline: 16px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
#chips::-webkit-scrollbar { display: none; }
#chips:empty { display: none; }
#chips .chip { flex: none; white-space: nowrap; }
#chips.wrap { flex-wrap: wrap; -webkit-mask-image: none; mask-image: none; }
#chips.wrap .chip { flex: initial; white-space: normal; padding-block: 4px; }
.box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border: 2px solid var(--line-2); border-radius: 18px; background: var(--bg); }
.box:focus-within { border-color: var(--ink); }
.box textarea { flex: 1; min-width: 0; max-height: 9em; padding-block: 5px; border: 0; outline: 0; resize: none; background: none; font-size: 1.0625rem; line-height: 1.3; }
.box textarea::placeholder { color: var(--ink-3); }
.send { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--pri); color: var(--on-pri); }
.send:disabled { background: var(--bg-3); color: var(--ink-3); }
.fine { font-size: .8125rem; color: var(--ink-3); }

.canvas { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--paste); }
.cv-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--bg); }
.seg button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px 0 6px; border-radius: 9px; font-size: .9375rem; font-weight: 600; white-space: nowrap; --s: 24px; }
.seg button.plain { padding-left: 12px; }
.seg button:hover { background: var(--bg-2); }
.seg button[aria-pressed="true"] { background: var(--bg-3); }
.seg button:disabled { opacity: .45; }
.zoom { margin-left: auto; font: 400 .8125rem var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
#paste { overflow: auto; padding: 8px 24px 96px; display: flex; gap: 24px; align-items: flex-start; justify-content: center; overscroll-behavior: contain; }
#paste.stack { flex-direction: column; align-items: center; justify-content: flex-start; }
.frame { flex: none; display: grid; gap: 6px; }
.frame-name { font-size: .875rem; font-weight: 600; color: var(--ink-2); }
.bw { position: relative; overflow: hidden; box-shadow: var(--lift); background: #fff; }
.bw > .b { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.dock { position: absolute; left: 50%; bottom: 16px; z-index: 3; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; max-width: calc(100% - 24px); padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--bg); box-shadow: var(--lift); font-size: .9375rem; }
.dock .dots button { display: block; border-radius: 50%; }
.dock-font { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-sep { width: 1px; height: 20px; background: var(--line-2); flex: none; }
.moments { display: flex; gap: 2px; }
.moments button { min-height: 32px; padding: 0 10px; border-radius: 999px; font-size: .875rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.moments button:hover { background: var(--bg-2); }
.moments button[aria-pressed="true"] { background: var(--pri); color: var(--on-pri); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; transform: translateX(-50%); padding: 9px 16px; border-radius: 10px; background: var(--pri); color: var(--on-pri); font-weight: 600; font-size: 1rem; }

/* ---------- Artboards: every value below comes from the merchant's look ---------- */
.b { container-type: inline-size; min-height: 560px; background: var(--b-bg); color: var(--b-ink); font: 400 17px/1.5 var(--b-body); }
.b h1, .b h2, .b h3 { margin: 0; font-family: var(--b-disp); font-weight: var(--b-dw); line-height: 1.12; letter-spacing: var(--b-dt); text-wrap: balance; }
.b p { margin: 0; }
.b ul { margin: 0; padding: 0; list-style: none; }
.b a { color: var(--b-ac); text-underline-offset: .18em; }
.band.kelsch { height: 12px; background-color: var(--b-bg); background-image: linear-gradient(90deg, color-mix(in srgb, var(--b-ac) 50%, transparent) 50%, transparent 0), linear-gradient(color-mix(in srgb, var(--b-ac) 50%, transparent) 50%, transparent 0); background-size: 12px 12px; }
.band.bar { height: 8px; background: var(--b-ac); }
.band.none { height: 0; }
.b-pad { padding-inline: 44px; }
.b-brand { font-family: var(--b-disp); font-weight: var(--b-bw); font-size: var(--b-bs); letter-spacing: var(--b-bt); text-transform: var(--b-bc); color: var(--b-brand); line-height: 1.1; }
.b-btn { display: inline-flex; align-items: center; min-height: 42px; padding: 0 18px; border: 0; border-radius: var(--b-rb); background: var(--b-ac); color: var(--b-on); font: 600 16px/1 var(--b-body); }
.b-btn.ghost { background: none; box-shadow: inset 0 0 0 1.5px var(--b-ac); color: var(--b-ac); }
.b-tag { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; background: var(--b-tag); color: var(--b-tag-ink); font-size: 14px; font-weight: 600; }
.b-card { padding: 20px 22px; background: var(--b-sf); border: 1px solid var(--b-ln); border-radius: var(--b-r); min-width: 0; }
.b-card h3 { font-size: 21px; margin-bottom: 6px; color: var(--b-h3); }
.b-mut { color: var(--b-mut); }
.b-mono { font: 400 13px/1.45 var(--mono); }
.b-panel { background: var(--b-panel); color: var(--b-panel-ink); border-radius: var(--b-r); border: var(--b-panel-bd); }

/* Public site, as read */
.p-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: var(--b-just); gap: 10px 24px; padding-block: 18px; }
.p-head nav { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-left: auto; font-size: 15px; font-weight: 600; }
.p-head small { display: block; font: 400 13px var(--b-body); color: var(--b-mut); }
.p-hero { display: grid; gap: 32px; padding-block: 36px 40px; }
.p-hero.split { grid-template-columns: 1.15fr 1fr; align-items: center; }
.p-hero.mid { text-align: center; justify-items: center; padding-block: 56px; }
.p-hero h1 { font-size: 58px; margin-bottom: 14px; }
.p-eyebrow { color: var(--b-ac); font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.p-lead { font-size: 19px; color: var(--b-mut); max-width: 34em; }
.p-acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.p-slate { padding: 20px 24px; background: var(--b-panel); color: var(--b-panel-ink); border: 10px solid var(--b-wood); border-radius: 6px; }
.p-slate h2 { font-size: 24px; font-style: italic; text-align: center; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed color-mix(in srgb, currentColor 40%, transparent); }
.p-price { display: flex; justify-content: space-between; gap: 12px; padding-block: 5px; }
.p-price span:last-child { white-space: nowrap; }
.p-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--b-gap); padding-bottom: 28px; }
.p-alt { padding-block: 26px; background: var(--b-sf2); }
.p-alt h2 { font-size: 30px; margin-bottom: 14px; }
.p-strip { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-block: 24px; }
.p-strip h2 { font-size: 28px; }
.p-book { padding: 26px 30px; border-radius: var(--b-r); }
.p-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.p-rule { width: 64px; height: 1px; background: var(--b-ac); }
.p-note { padding: 18px 0 26px; font-size: 13px; color: var(--b-mut); }
.p-wire { display: grid; place-items: center; min-height: 520px; text-align: center; }

/* Agent site: no interface, so no merchant colours either. It looks like what it is, frames on a wire. */
.b.wire { min-height: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--sans); }
.w { display: grid; gap: 20px; padding-block: 28px 32px; }
.w-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.w-addr { font: 600 26px/1.2 var(--mono); letter-spacing: -.01em; overflow-wrap: anywhere; }

const SLOT_MIN = 120;

}

const hexOf = rgb => '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');

/* The agent site has no pages. It is this: frames over BATP (documentation/PROTOCOL.md) and, for Claude, tools over the MCP bridge. */
const BATP_HOST = '191-96-88-152.sslip.io';
const DATE = '2026-10-31';
const BATP_INTENTS = ['DISCOVER', 'AVAILABILITY', 'BOOK', 'AMEND', 'CANCEL', 'RECALL', 'PING'];
const stamp = t => `${DATE}T${t}:00+01:00`;
const HELLO = { type: 'hello', batp: '0.1', agent: { id: 'urn:batp:agent:claude-gateway', name: 'Claude via the Sésame gateway', kind: 'user-agent', operator: 'merchant-agents' }, token: '…' };
const WELCOME = { type: 'welcome', batp: '0.1', node: { id: 'urn:batp:node:merchant-agents', name: 'Sésame' }, intents: BATP_INTENTS, session: 's-1' };
const frameReq = (id, intent, params, merchant) => ({ type: 'request', id, intent, ...(merchant ? { merchant } : {}), params });
const frameRes = (id, body) => ({ type: 'response', id, ...body });
const notLive = s => ({ status: 404, error: { code: 'not_found', message: `Merchant '${s.slug}' is not live yet` } });
const wireRes = (s, b) => ({ id: b.id, merchant: s.slug, starts_at: stamp(b.time), party_size: b.party, table_label: b.table, status: b.status, guest_name: b.guest, via: b.via });
const toolsOf = s => {
  const services = s.services.map(v => `${v.start}-${v.end}`).join(', ');
  return [
    { sel: 'max services', name: 'get_availability', description: `Check free tables at ${s.name} (${s.city || 'unknown city'}). Services: ${services}. Groups up to ${s.maxParty}.` },
    { sel: 'create', name: 'create_reservation', description: `Book a table at ${s.name}. Always confirm with the guest first.` },
    { sel: 'update', name: 'update_reservation', description: `Move or resize a booking at ${s.name}.` },
    { sel: 'policy', name: 'cancel_reservation', description: `Cancel a booking at ${s.name}. Policy: ${(s.policy || 'none stated').replace(/\.$/, '')}.` },
  ];
};
function availability(s, time, party) {
  const limit = Math.min(s.maxParty, largest(s));
  if (party > limit) return { status: 413, error: { code: 'party_too_large', message: `${s.name} takes online bookings for up to ${limit} guests`, fallback_url: s.fallback } };
  const near = allStarts(s).filter(t => !s.blocked.includes(t)).map(t => ({ t, tb: pickTable(s, party, t) })).filter(x => x.tb)
    .sort((a, b) => Math.abs(toMin(a.t) - toMin(time)) - Math.abs(toMin(b.t) - toMin(time))).slice(0, 3)
    .sort((a, b) => toMin(a.t) - toMin(b.t));
  return { status: 200, result: { slots: near.map(x => ({ starts_at: stamp(x.t), table_label: x.tb.label })) } };
}
const wireLine = (dir, obj, sel = '') => `<div class="w-f ${dir}"${sel ? ` data-sel="${sel}"` : ''}><span aria-hidden="true">${dir === 'out' ? '→' : '←'}</span><code>${esc(JSON.stringify(obj)).replace(/&quot;status&quot;:(\d{3})/, (_, c) => `&quot;status&quot;:<b class="w-s ${c === '200' ? 'ok' : 'bad'}">${c}</b>`)}</code></div>`;
const exampleAsk = s => {
  const starts = startsOf(lastService(s));
  return { time: s.blocked[s.blocked.length - 1] || starts[starts.length - 1], party: Math.max(1, Math.min(4, s.maxParty, largest(s))) };
};
function agentBoard(s) {

        ${s.log.map((f, i) => wireLine('out', f.out) + wireLine('in', f.in, i === s.log.length - 1 ? 'last' : '')).join('')}</div>
      <div class="w-send" role="group" aria-label="Send a request"><span>Send</span>${BATP_INTENTS.map(i => `<button type="button" data-send="${i}">${i}</button>`).join('')}</div>

const TEST_GUESTS = ['Kim Weber', 'Jo Bauer', 'Mia Klein', 'Tom Graf', 'Eva Roth', 'Max Lang'];
const guestBookings = s => confirmed(s).filter(b => b.via === 'claude');
function sendFrame(s, intent, o = {}) {
  const id = `r-${++s.reqN}`, live = s.published || o.preview, last = guestBookings(s).slice(-1)[0];
  const answer = (params, merchant, body, extra = {}) => { s.log.push({ out: frameReq(id, intent, params, merchant), in: frameRes(id, body) }); return { body, ...extra }; };
  const unknown = { status: 404, error: { code: 'not_found', message: 'Unknown reservation' } };
  if (intent === 'PING') return answer({}, null, { status: 200, result: { pong: true, server_time: stamp(MOMENTS.find(m => m.id === s.moment).at(s)) } });
  if (intent === 'DISCOVER') {
    const merchants = live ? [{ slug: s.slug, name: s.name, city: s.city, tags: s.tags, price_level: s.price, website: `https://${s.host}/` }] : [];
    return answer({ query: 'table for 4 tonight' }, null, { status: 200, result: { merchants, suggestions: [], ignored_filters: [] } });
  }
  if (intent === 'RECALL') {
    const guest = last ? last.guest : TEST_GUESTS[0];
    return answer({ guest_name: guest }, null, { status: 200, result: { reservations: live ? confirmed(s).filter(b => b.guest === guest).map(b => wireRes(s, b)) : [], notices: s.notices } });
  }
  if (intent === 'AVAILABILITY') {
    const ex = exampleAsk(s), time = o.time || ex.time, party = o.party || ex.party;
    return answer({ date: DATE, time, party_size: party }, s.slug, live ? availability(s, time, party) : notLive(s));
  }
  if (intent === 'BOOK') {
    const guest = TEST_GUESTS[s.bookings.length % TEST_GUESTS.length], party = Math.min(2, s.maxParty);
    const starts = startsOf(lastService(s)).filter(t => !s.blocked.includes(t) && pickTable(s, party, t)).reverse();
    const params = t => ({ starts_at: stamp(t), party_size: party, guest_name: guest, idempotency_key: `k-${s.reqN}` });
    if (!live) return answer(params(exampleAsk(s).time), s.slug, notLive(s));
    if (!starts.length) return answer(params(exampleAsk(s).time), s.slug, { status: 409, error: { code: 'slot_unavailable', message: 'Slot taken or blocked' } });
    const b = addBooking(s, guest, starts[0], party, 'claude');
    return answer(params(starts[0]), s.slug, { status: 200, result: { reservation: wireRes(s, b) } }, { booking: b });
  }
  if (intent === 'AMEND') {
    const fallbackParams = { reservation_id: 'R-001', guest_name: TEST_GUESTS[0], starts_at: stamp(exampleAsk(s).time), idempotency_key: `k-${s.reqN}` };
    if (!live) return answer(fallbackParams, s.slug, notLive(s));
    if (!last) return answer(fallbackParams, s.slug, unknown);
    last.status = 'moving';
    const t = startsOf(lastService(s)).filter(x => x !== last.time && !s.blocked.includes(x)).find(x => pickTable(s, last.party, x));
    const tb = t && pickTable(s, last.party, t);
    last.status = 'confirmed';
    const params = { reservation_id: last.id, guest_name: last.guest, starts_at: stamp(t || last.time), idempotency_key: `k-${s.reqN}` };
    if (!tb) return answer(params, s.slug, { status: 409, error: { code: 'slot_unavailable', message: 'Slot taken or blocked' } });
    last.time = t; last.table = tb.label;
    return answer(params, s.slug, { status: 200, result: { reservation: wireRes(s, last) } }, { moved: last });
  }
  /* CANCEL */
  const params = last ? { reservation_id: last.id, guest_name: last.guest } : { reservation_id: 'R-001', guest_name: TEST_GUESTS[0] };
  if (!live) return answer(params, s.slug, notLive(s));
  if (!last) return answer(params, s.slug, unknown);
  last.status = 'cancelled';
  return answer(params, s.slug, { status: 200, result: { reservation: wireRes(s, last) } }, { cancelled: last });
}

const viaLabel = v => ({ claude: 'via Claude', website: 'via website', merchant: 'taken by you' }[v] || v);
const rows = (s, list) => `<table class="m-rows"><caption class="sr">${esc(cap(s.words.bookings))}</caption><tbody>${list.map(b => `<tr data-sel="b-${b.id}"><td>${b.time}</td><td>${esc(b.guest)}</td><td>${count(b.party, s.words.guests)}</td><td>${esc(b.table)}</td><td>${viaLabel(b.via)}</td></tr>`).join('')}</tbody></table>`;

function momentPanel(s) {
  const w = s.words, sv = lastService(s), list = inService(s, sv), guests = list.reduce((n, b) => n + b.party, 0), at = MOMENTS.find(m => m.id === s.moment).at(s);
  if (s.moment === 'morning') {

    return `<h1 class="m-title">Today</h1><p class="m-sum">${count(s.services.length, 'services')}, ${count(seatsOf(s), 'seats')}.</p>
      ${s.services.map(v => { const l = inService(s, v), g = l.reduce((n, b) => n + b.party, 0); return `<div class="m-svc" data-sel="services"><b>${v.name}</b><span>${v.start}–${v.end}</span><small>${count(l.length, w.bookings)}, ${count(g, w.guests)} ${sampleTag(s)}</small></div>`; }).join('')}
      ${checks.length ? `<ul class="m-check" data-sel="checks">${checks.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}`;
  }
  if (!list.length && s.moment !== 'after') {

  }
  if (s.moment === 'before') {
    return `<div class="b-panel m-panel" data-sel="list"><h1 class="m-title">Tonight ${sampleTag(s)}</h1><p class="m-sum">${count(list.length, w.bookings)}, ${count(guests, w.guests)} of ${seatsOf(s)} seats.</p>${rows(s, list)}</div>`;
  }
  if (s.moment === 'service') {
    const t = toMin(at), next = list.filter(b => toMin(b.time) > t), seated = list.filter(b => toMin(b.time) <= t && t < toMin(b.time) + SLOT_MIN);
    const n = next[0];
    return `<div class="b-panel m-panel" data-sel="list">
      ${n ? `<p style="font-size:18px;opacity:.8">Next ${sampleTag(s)}</p><div class="m-next-time" data-sel="b-${n.id}">${n.time}</div><div class="m-next-who">${esc(n.guest)}</div><div class="m-next-sub">${count(n.party, w.guests)}, ${esc(one(w.tables))} ${esc(n.table)}</div>` : `<div class="m-next-who">No more arrivals tonight.</div>`}
      ${next[1] ? `<p class="m-then">Then ${next[1].time}, ${esc(next[1].guest)}, ${count(next[1].party, w.guests)}</p>` : ''}
      <p class="m-then">Seated now: ${seated.length ? seated.map(b => `${esc(b.table)} ${esc(b.guest)}`).join(', ') : 'nobody'}</p></div>`;

}

function floorOf(s) {
  const at = toMin(MOMENTS.find(m => m.id === s.moment).at(s));
  const list = inService(s, lastService(s));
  const busy = new Set(), next = new Set();
  if (s.moment === 'service') list.forEach(b => { if (toMin(b.time) <= at && at < toMin(b.time) + SLOT_MIN) busy.add(b.table); else if (toMin(b.time) > at) next.add(b.table); });
  if (s.moment === 'before') list.forEach(b => next.add(b.table));
  return `<div class="floor" data-sel="floor">${s.tables.map(t => `<div class="tb s${t.seats >= 6 ? 6 : t.seats >= 4 ? 4 : 2} ${busy.has(t.label) ? 'busy' : next.has(t.label) ? 'next' : ''}" data-sel="tb-${esc(t.label)}">${esc(t.label)}<small>${t.seats}</small></div>`).join('')}</div>

}

  const W = narrow ? aw : across ? 760 : 1000;

/* ---------- starting a conversation ---------- */
function parseAddress(text) {
  const t = text.trim(), low = t.toLowerCase();
  for (const x of Object.values(SITES)) {
    for (const needle of [x.host, x.name.toLowerCase(), x.slug]) {
      if (low.includes(needle)) return { site: x, rest: t.replace(new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '').replace(/^[\s,.:;-]+/, '').trim() };
    }
  }
  const m = t.match(/(?:https?:\/\/)?((?:[a-z0-9-]+\.)+[a-z]{2,})(\/\S*)?/i);
  if (m) return { site: customSite(m[1].toLowerCase().replace(/^www\./, '')), rest: t.replace(m[0], '').replace(/^[\s,.:;-]+/, '').trim() };
  return null;
}

async function handleAddress(text) {

    setChips(Object.values(SITES).map(x => x.host));

/* ---------- description wins over the site (§8.3) ---------- */
function applyBrief(s, text) {
  const told = [];
  if (/^skip\b/i.test(text.trim())) {
    if (s.custom) {
      s.flags.push(['No floor plan from you.', 'I drafted 40 seats on ' + s.tables.length + ' tables, with Sésame\'s default rule. Correct it by asking.']);
      s.flags.push(['Groups up to 8 and dinner 19:00–22:00 are defaults.', 'Tell me your real limits and hours.']);
    } else {
      s.flags.unshift(['You skipped the floor plan.', `I drafted ${s.tables.length} tables for ${seatsOf(s)} seats. Correct it by asking.`]);
    }
    return told;
  }
  const seats = text.match(/(\d+)\s*(?:seats?|covers?|couverts?|places?)/i);
  if (seats && +seats[1] !== seatsOf(s) && +seats[1] > 0 && +seats[1] <= 400) {
    s.tables = defaultTables(+seats[1]);
    s.flags.unshift(['I drafted your floor plan from the seat count.', `${s.tables.length} tables for ${+seats[1]} seats. Correct it by asking.`]);
    s.bookings = []; s.sample.forEach(([g, t, p, v]) => addBooking(s, g, t, p, v));
  }
  told.push(['Room', `${seatsOf(s)} seats on ${s.tables.length} tables`]);
  const max = text.match(/(?:groups?|party|parties|max)\D{0,16}(\d+)/i);
  if (max && +max[1] > 0) {
    if (!s.custom && +max[1] !== s.maxParty) s.flags.unshift(['Your description and your site disagree on group size.', `Your site suggests ${s.maxParty}, you said ${+max[1]}. Your words win.`]);
    s.maxParty = +max[1];
  }
  told.push(['Largest group', String(s.maxParty)]);
  const hours = [...text.matchAll(/(\d{1,2})[:h]?(\d{2})?\s*(?:-|–|to)\s*(\d{1,2})[:h]?(\d{2})?/g)]

function parseTime(text) {
  const m = text.match(/\b(\d{1,2})(?:[:h](\d{2}))?\s*(am|pm)?\b/i);
  if (!m) return null;
  let h = +m[1]; const min = +(m[2] || 0);
  if (/pm/i.test(m[3] || '') && h < 12) h += 12;
  if (/am/i.test(m[3] || '') && h === 12) h = 0;
  if (h > 23 || min > 59) return null;
  return toHM(h * 60 + min);
}

function route(text) {
  for (const [re, fn] of INTENTS) { const m = text.match(re); if (m) return fn(text, m); }

}

function doBlock(text) {

  if (!allStarts(S).includes(t)) return bot(`${t} isn't a bookable time. Tonight's are ${allStarts(S).join(', ')}.`);
  if (S.blocked.includes(t)) return bot(`${t} is already blocked.`);

  bot(`${t} is blocked tonight, so agents don't get it any more.${kept.length ? ` ${kept.map(b => esc(b.guest)).join(' and ')} keep${kept.length === 1 ? 's' : ''} their table.` : ''}`);

function doUnblock(text) {

function doHours(text) {

  if (c && !busy) submit(c.dataset.say);
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b && !b.disabled) { clearSel(); setView(b.dataset.view); } });
$$('.pane-switch button').forEach(b => b.addEventListener('click', () => showPane(b.dataset.paneTo)));
$('#st-publish').addEventListener('click', () => { if (phase === 'review' && !busy) submit('Publish'); });

document.addEventListener('click', e => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) { copy(copyBtn.dataset.copy); return; }
  const open = e.target.closest('[data-open]');
  if (open) { clearSel(); setView(open.dataset.open, true); return; }
  const fact = e.target.closest('[data-fact]');
  if (fact) {
    $$('[data-fact]', feed).forEach(f => f.setAttribute('aria-pressed', String(f === fact)));
    view = 'public'; paint(); showPane('canvas');
    flash('f', [[fact.dataset.fact, fact.dataset.label]]);
    return;
  }
  const sendB = e.target.closest('[data-send]');
  if (sendB && S && !busy) { runIntent(sendB.dataset.send); return; }
  const mo = e.target.closest('[data-moment]');
  if (mo) { setMoment(mo.dataset.moment); return; }
  const fill = e.target.closest('[data-fill]');
  if (fill) { input.value = fill.dataset.fill; showPane('chat'); input.focus(); syncSend(); }
});

new ResizeObserver(() => fit()).observe($('#paste'));
addEventListener('resize', fit);
if (document.fonts?.ready) document.fonts.ready.then(fit);

greet(); setStatus(); paint();

/* Plain anchor deep link: #le-petit-zinc, #la-graine-verte or #maison-albane opens that restaurant, already built. */
const openFromHash = () => { const k = location.hash.slice(1); if (SITES[k]) openSite(k); };
addEventListener('hashchange', openFromHash);
openFromHash();
})();
</script>
</body>
</html>
